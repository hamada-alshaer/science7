const UNITS=[{"n": 1, "title": "Introducing Science", "lessons": [{"id": "1.1", "title": "What Is Science?", "paras": ["Science is a way of finding out how the natural world works. Scientists ask questions, make careful observations, do tests and use the evidence to explain what they find.", "Science has many branches. Biology studies living things, chemistry studies substances and how they change, and physics studies forces, energy, light and sound. Science also links to other subjects such as maths and geography."], "key": ["science", "biology", "chemistry", "physics", "evidence"], "qs": [{"q": "Name the three main branches of science.", "o": ["Biology.", "Examples: medicines, clean water, electricity, better crops, mobile phones.", "Evidence shows whether an explanation is right or wrong, so conclusions are based on facts, not guesses.", "Biology, chemistry and physics."], "a": 3}, {"q": "Which branch studies living things?", "o": ["Examples: medicines, clean water, electricity, better crops, mobile phones.", "Biology.", "Biology, chemistry and physics.", "Evidence shows whether an explanation is right or wrong, so conclusions are based on facts, not guesses."], "a": 1}, {"q": "Why do scientists need evidence?", "o": ["Examples: medicines, clean water, electricity, better crops, mobile phones.", "Evidence shows whether an explanation is right or wrong, so conclusions are based on facts, not guesses.", "Biology, chemistry and physics.", "Biology."], "a": 1}, {"q": "Give one way science helps people in daily life.", "o": ["Examples: medicines, clean water, electricity, better crops, mobile phones.", "Biology, chemistry and physics.", "Biology.", "Evidence shows whether an explanation is right or wrong, so conclusions are based on facts, not guesses."], "a": 0}], "cards": [{"en": "science", "ar": "علم", "pr": "SY-ens", "ex": "Studying how plants grow is science."}, {"en": "biology", "ar": "الأحياء", "pr": "by-OL-uh-jee", "ex": "Biology studies cells, plants and animals."}, {"en": "chemistry", "ar": "الكيمياء", "pr": "KEM-is-tree", "ex": "Chemistry explains why iron rusts."}, {"en": "physics", "ar": "الفيزياء", "pr": "FIZ-iks", "ex": "Physics explains why a ball falls."}, {"en": "evidence", "ar": "دليل", "pr": "EV-i-dens", "ex": "Measurements are evidence for a conclusion."}]}, {"id": "1.2", "title": "What Are the Important Attitudes in Science?", "paras": ["Good scientists share certain attitudes. They are curious, so they ask questions. They are honest and record results exactly as they happen, even if the result is unexpected.", "They are patient and repeat measurements to check them. They are open-minded and willing to change their ideas when new evidence appears. They are also careful about safety and respect others, working well in a team."], "key": ["curiosity", "honesty", "patience", "open-minded", "cooperation"], "qs": [{"q": "What does it mean to be curious?", "o": ["Willing to listen to other ideas and change your own if the evidence supports it.", "Record the result exactly as it was and not change it.", "To check the results are reliable and to spot mistakes.", "Wanting to find out and asking questions about things."], "a": 3}, {"q": "A result is not what you expected. What should an honest scientist do?", "o": ["Record the result exactly as it was and not change it.", "To check the results are reliable and to spot mistakes.", "Wanting to find out and asking questions about things.", "Willing to listen to other ideas and change your own if the evidence supports it."], "a": 0}, {"q": "Why is it good to repeat an experiment?", "o": ["Record the result exactly as it was and not change it.", "To check the results are reliable and to spot mistakes.", "Willing to listen to other ideas and change your own if the evidence supports it.", "Wanting to find out and asking questions about things."], "a": 1}, {"q": "What does open-minded mean?", "o": ["To check the results are reliable and to spot mistakes.", "Willing to listen to other ideas and change your own if the evidence supports it.", "Wanting to find out and asking questions about things.", "Record the result exactly as it was and not change it."], "a": 1}], "cards": [{"en": "curiosity", "ar": "الفضول", "pr": "kyoor-ee-OS-i-tee", "ex": "Curiosity makes you ask why the sky is blue."}, {"en": "honesty", "ar": "الأمانة", "pr": "ON-es-tee", "ex": "Writing the real result, even if unexpected."}, {"en": "patience", "ar": "الصبر", "pr": "PAY-shens", "ex": "Waiting and repeating a test again."}, {"en": "open-minded", "ar": "منفتح الذهن", "pr": "OH-pen-MYND-id", "ex": "Changing your idea when new evidence appears."}, {"en": "cooperation", "ar": "التعاون", "pr": "koh-op-er-AY-shun", "ex": "Sharing jobs in a group experiment."}]}, {"id": "1.3", "title": "What Are Skills and Processes in Science?", "paras": ["Scientists use skills such as observing, measuring, classifying, predicting and communicating. Observing means using your senses (and instruments) to gather information.", "A fair test follows steps: ask a question, make a prediction, plan, carry out the test, record results, and draw a conclusion. In a fair test you change only one factor, called the <b>variable you change</b> (independent variable). You measure the <b>variable that responds</b> (dependent variable). All other factors are kept the same (controlled variables). A table and a graph help present results."], "key": ["observe", "predict", "variable", "fair test", "conclusion"], "qs": [{"q": "What is a prediction?", "o": ["A statement of what you think will happen, based on knowledge or earlier observations.", "So the test is fair and only the changed variable affects the result.", "The amount of sugar.", "The time taken to dissolve."], "a": 0}, {"q": "In a test on how sugar amount affects dissolving time, what is the variable you change?", "o": ["The time taken to dissolve.", "So the test is fair and only the changed variable affects the result.", "A statement of what you think will happen, based on knowledge or earlier observations.", "The amount of sugar."], "a": 3}, {"q": "What is measured in that test?", "o": ["So the test is fair and only the changed variable affects the result.", "The time taken to dissolve.", "A statement of what you think will happen, based on knowledge or earlier observations.", "The amount of sugar."], "a": 1}, {"q": "Why must other factors be kept the same?", "o": ["A statement of what you think will happen, based on knowledge or earlier observations.", "So the test is fair and only the changed variable affects the result.", "The time taken to dissolve.", "The amount of sugar."], "a": 1}], "cards": [{"en": "observe", "ar": "يلاحظ", "pr": "ob-ZURV", "ex": "Observe the colour change in a test tube."}, {"en": "predict", "ar": "يتوقع", "pr": "pri-DIKT", "ex": "I predict ice melts faster in warm water."}, {"en": "variable", "ar": "متغير", "pr": "VAIR-ee-uh-bul", "ex": "The amount of sugar is the variable you change."}, {"en": "fair test", "ar": "اختبار عادل", "pr": "fair test", "ex": "Keep water volume the same in every test."}, {"en": "conclusion", "ar": "الاستنتاج", "pr": "kon-KLOO-zhun", "ex": "Warm water dissolves sugar faster."}]}, {"id": "1.4", "title": "What Are Some Safety Rules in the Laboratory?", "paras": ["A laboratory can be dangerous, so rules protect everyone. Wear safety goggles and tie back long hair. Do not eat, drink or run. Listen to your teacher and follow instructions exactly.", "Never taste chemicals. Handle hot objects with care and point test tubes away from people when heating. Wash hands at the end. Tell the teacher at once about spills or accidents. Hazard symbols on containers warn you, for example flammable, corrosive, toxic and harmful."], "key": ["safety goggles", "hazard symbol", "flammable", "corrosive", "toxic"], "qs": [{"q": "Why wear safety goggles?", "o": ["The substance catches fire easily.", "To protect eyes from splashes and broken glass.", "Tell the teacher immediately.", "Chemicals could get into your food or drink and harm you."], "a": 1}, {"q": "What should you do if you spill a chemical?", "o": ["The substance catches fire easily.", "Chemicals could get into your food or drink and harm you.", "To protect eyes from splashes and broken glass.", "Tell the teacher immediately."], "a": 3}, {"q": "What does a flammable symbol warn about?", "o": ["The substance catches fire easily.", "To protect eyes from splashes and broken glass.", "Chemicals could get into your food or drink and harm you.", "Tell the teacher immediately."], "a": 0}, {"q": "Why should you not eat or drink in a lab?", "o": ["The substance catches fire easily.", "Chemicals could get into your food or drink and harm you.", "Tell the teacher immediately.", "To protect eyes from splashes and broken glass."], "a": 1}], "cards": [{"en": "safety goggles", "ar": "نظارات السلامة", "pr": "SAYF-tee GOG-ulz", "ex": "Wear them when heating liquids."}, {"en": "hazard symbol", "ar": "رمز الخطر", "pr": "HAZ-erd SIM-bul", "ex": "A flame picture means flammable."}, {"en": "flammable", "ar": "قابل للاشتعال", "pr": "FLAM-uh-bul", "ex": "Alcohol is flammable."}, {"en": "corrosive", "ar": "مادة أكّالة", "pr": "kuh-ROH-siv", "ex": "Strong acids are corrosive."}, {"en": "toxic", "ar": "سام", "pr": "TOK-sik", "ex": "Some chemicals are toxic if swallowed."}]}, {"id": "1.5", "title": "What Are Some Apparatus in the Laboratory?", "paras": ["Apparatus are the tools used in experiments. A Bunsen burner heats things. A beaker holds and heats liquids, and a test tube holds small amounts. A measuring cylinder measures volume of liquid accurately. A conical flask is used to mix liquids. A filter funnel with filter paper separates solids from liquids.", "A thermometer measures temperature, a balance measures mass, and a stopwatch measures time. A tripod and gauze support containers over the flame. Tongs or a holder grip hot objects. When reading a measuring cylinder, put your eye level with the bottom of the curved liquid surface."], "key": ["Bunsen burner", "beaker", "measuring cylinder", "thermometer", "filter funnel"], "qs": [{"q": "Which apparatus measures the volume of a liquid most accurately?", "o": ["Separating an insoluble solid from a liquid.", "A measuring cylinder.", "A thermometer.", "With your eye level with the bottom of the meniscus (curved surface)."], "a": 1}, {"q": "What is a filter funnel used for?", "o": ["Separating an insoluble solid from a liquid.", "With your eye level with the bottom of the meniscus (curved surface).", "A measuring cylinder.", "A thermometer."], "a": 0}, {"q": "Which instrument measures temperature?", "o": ["With your eye level with the bottom of the meniscus (curved surface).", "A measuring cylinder.", "A thermometer.", "Separating an insoluble solid from a liquid."], "a": 2}, {"q": "How should you read the volume in a measuring cylinder?", "o": ["A thermometer.", "Separating an insoluble solid from a liquid.", "A measuring cylinder.", "With your eye level with the bottom of the meniscus (curved surface)."], "a": 3}], "cards": [{"en": "Bunsen burner", "ar": "موقد بنزن", "pr": "BUN-sen BUR-ner", "ex": "Used to heat a test tube."}, {"en": "beaker", "ar": "كأس زجاجية", "pr": "BEE-ker", "ex": "Hold and heat liquids in a beaker."}, {"en": "measuring cylinder", "ar": "مخبار مدرّج", "pr": "MEZH-er-ing SIL-in-der", "ex": "Measure 50 mL of water."}, {"en": "thermometer", "ar": "ميزان حرارة", "pr": "ther-MOM-i-ter", "ex": "Measure the water at 25 degrees C."}, {"en": "filter funnel", "ar": "قمع الترشيح", "pr": "FIL-ter FUN-ul", "ex": "Separates sand from water."}]}, {"id": "1.6", "title": "Science and Technology", "paras": ["Science explains how things work. Technology is using that knowledge to make useful things and solve problems. For example, scientific knowledge about electricity led to technology such as lights and computers.", "Technology brings benefits like faster travel, better medicine and easy communication. It can also cause problems such as pollution and overuse of resources. Science and technology help each other: new technology gives scientists better instruments, and new discoveries lead to new technology."], "key": ["technology", "benefit", "problem", "invention"], "qs": [{"q": "What is technology?", "o": ["Example: vaccines, faster communication.", "Example: pollution from factories and vehicles.", "It gives them better instruments, such as microscopes and computers, to make discoveries.", "Using scientific knowledge to make useful products or solve problems."], "a": 3}, {"q": "Give one benefit of technology.", "o": ["Example: vaccines, faster communication.", "Example: pollution from factories and vehicles.", "It gives them better instruments, such as microscopes and computers, to make discoveries.", "Using scientific knowledge to make useful products or solve problems."], "a": 0}, {"q": "Give one problem technology can cause.", "o": ["It gives them better instruments, such as microscopes and computers, to make discoveries.", "Using scientific knowledge to make useful products or solve problems.", "Example: vaccines, faster communication.", "Example: pollution from factories and vehicles."], "a": 3}, {"q": "How does technology help scientists?", "o": ["Example: vaccines, faster communication.", "It gives them better instruments, such as microscopes and computers, to make discoveries.", "Example: pollution from factories and vehicles.", "Using scientific knowledge to make useful products or solve problems."], "a": 1}], "cards": [{"en": "technology", "ar": "التكنولوجيا", "pr": "tek-NOL-uh-jee", "ex": "A mobile phone is technology."}, {"en": "benefit", "ar": "فائدة", "pr": "BEN-i-fit", "ex": "A benefit of vaccines is fewer illnesses."}, {"en": "problem", "ar": "مشكلة", "pr": "PROB-lem", "ex": "Pollution is a problem from factories."}, {"en": "invention", "ar": "اختراع", "pr": "in-VEN-shun", "ex": "The light bulb is an invention."}]}]}, {"n": 2, "title": "Physical Quantities and Measurements", "lessons": [{"id": "2.1", "title": "Why Do We Make Measurements?", "paras": ["Measuring gives exact numbers, while our senses can be wrong. For example, hands can feel hot or cold depending on what they touched before. Measurements let us compare things, repeat experiments and share results with others.", "A measurement has a number and a unit, such as 5 cm. Using the same units everywhere means everyone understands the result."], "key": ["measurement", "unit", "accurate", "compare"], "qs": [{"q": "Why are measurements better than just using our senses?", "o": ["So results can be understood and compared by everyone.", "To check they are reliable.", "A number and a unit.", "They are exact and not affected by feelings or opinion."], "a": 3}, {"q": "What two parts make up a measurement?", "o": ["A number and a unit.", "To check they are reliable.", "So results can be understood and compared by everyone.", "They are exact and not affected by feelings or opinion."], "a": 0}, {"q": "Why do scientists use the same units?", "o": ["They are exact and not affected by feelings or opinion.", "To check they are reliable.", "A number and a unit.", "So results can be understood and compared by everyone."], "a": 3}, {"q": "Why do we repeat measurements?", "o": ["They are exact and not affected by feelings or opinion.", "So results can be understood and compared by everyone.", "A number and a unit.", "To check they are reliable."], "a": 3}], "cards": [{"en": "measurement", "ar": "قياس", "pr": "MEZH-er-ment", "ex": "The measurement is 12 cm."}, {"en": "unit", "ar": "وحدة", "pr": "YOO-nit", "ex": "cm is a unit of length."}, {"en": "accurate", "ar": "دقيق", "pr": "AK-yer-it", "ex": "An accurate scale gives the true mass."}, {"en": "compare", "ar": "يقارن", "pr": "kum-PAIR", "ex": "Compare the heights of two plants."}]}, {"id": "2.2", "title": "Physical Quantities and SI Units", "paras": ["A physical quantity is something that can be measured, such as length, mass, time, temperature and area. The international system of units is the SI system.", "SI base units: length in metre (m), mass in kilogram (kg), time in second (s), temperature in kelvin (K). Everyday we also use degrees Celsius. Prefixes change the size: kilo = 1000, centi = 1/100, milli = 1/1000. So 1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm, 1 kg = 1000 g."], "key": ["physical quantity", "SI unit", "kilo", "centi", "milli"], "qs": [{"q": "What is the SI unit of mass?", "o": ["3.5 m.", "2500 m.", "One thousandth (1/1000).", "The kilogram (kg)."], "a": 3}, {"q": "How many metres are in 2.5 km?", "o": ["3.5 m.", "The kilogram (kg).", "2500 m.", "One thousandth (1/1000)."], "a": 2}, {"q": "Convert 350 cm to metres.", "o": ["The kilogram (kg).", "2500 m.", "3.5 m.", "One thousandth (1/1000)."], "a": 2}, {"q": "What does the prefix milli mean?", "o": ["The kilogram (kg).", "3.5 m.", "2500 m.", "One thousandth (1/1000)."], "a": 3}], "cards": [{"en": "physical quantity", "ar": "كمية فيزيائية", "pr": "FIZ-i-kul KWON-ti-tee", "ex": "Length and mass are physical quantities."}, {"en": "SI unit", "ar": "وحدة النظام الدولي", "pr": "ess-EYE YOO-nit", "ex": "The kilogram is the SI unit of mass."}, {"en": "kilo", "ar": "كيلو (ألف)", "pr": "KEE-loh", "ex": "1 km = 1000 m."}, {"en": "centi", "ar": "سنتي (جزء من مئة)", "pr": "SEN-tee", "ex": "1 m = 100 cm."}, {"en": "milli", "ar": "ملي (جزء من ألف)", "pr": "MIL-ee", "ex": "1 m = 1000 mm."}]}, {"id": "2.3", "title": "How Do We Measure Length?", "paras": ["Length is the distance between two points. Use a ruler for short lengths, a measuring tape for longer or curved lengths, and a trundle wheel for long distances outdoors. Vernier calipers measure very small thicknesses accurately.", "To measure with a ruler: place the zero mark exactly at one end, keep your eye directly above the mark to avoid parallax error, and read to the nearest millimetre. To measure a curved line, lay a thread along it, then straighten the thread against a ruler."], "key": ["length", "ruler", "trundle wheel", "parallax error"], "qs": [{"q": "What instrument measures a long outdoor distance?", "o": ["A trundle wheel (or long measuring tape).", "42 mm.", "To avoid parallax error, a wrong reading from looking at an angle.", "Follow it with a piece of thread, then straighten the thread and measure it with a ruler."], "a": 0}, {"q": "How can you measure the length of a curved line?", "o": ["Follow it with a piece of thread, then straighten the thread and measure it with a ruler.", "To avoid parallax error, a wrong reading from looking at an angle.", "42 mm.", "A trundle wheel (or long measuring tape)."], "a": 0}, {"q": "Why should your eye be directly above the scale?", "o": ["Follow it with a piece of thread, then straighten the thread and measure it with a ruler.", "To avoid parallax error, a wrong reading from looking at an angle.", "A trundle wheel (or long measuring tape).", "42 mm."], "a": 1}, {"q": "How many mm are in 4.2 cm?", "o": ["A trundle wheel (or long measuring tape).", "42 mm.", "To avoid parallax error, a wrong reading from looking at an angle.", "Follow it with a piece of thread, then straighten the thread and measure it with a ruler."], "a": 1}], "cards": [{"en": "length", "ar": "الطول", "pr": "length", "ex": "The length of a desk is 120 cm."}, {"en": "ruler", "ar": "مسطرة", "pr": "ROO-ler", "ex": "Measure a pencil with a ruler."}, {"en": "trundle wheel", "ar": "عجلة القياس", "pr": "TRUN-dul weel", "ex": "Measure a football pitch."}, {"en": "parallax error", "ar": "خطأ الرؤية الجانبية", "pr": "PA-ruh-laks ER-er", "ex": "Reading a ruler from the side."}]}, {"id": "2.4", "title": "How Do We Measure Area?", "paras": ["Area is the amount of surface a shape covers. Its units are square metres (m2) or square centimetres (cm2).", "For a rectangle, area = length x width. For a regular square, side x side. For an irregular shape, trace it on squared (graph) paper and count the squares: count full squares, and count squares that are half or more as whole, ignoring smaller bits."], "key": ["area", "m2", "cm2", "irregular shape"], "qs": [{"q": "What is the area of a rectangle 8 cm by 5 cm?", "o": ["8 x 5 = 40 cm2.", "Square units, such as cm2 or m2.", "Trace it on squared paper and count the squares it covers.", "36 m2."], "a": 0}, {"q": "What are the units of area?", "o": ["Trace it on squared paper and count the squares it covers.", "36 m2.", "Square units, such as cm2 or m2.", "8 x 5 = 40 cm2."], "a": 2}, {"q": "How do you find the area of an irregular shape such as a leaf?", "o": ["Square units, such as cm2 or m2.", "36 m2.", "Trace it on squared paper and count the squares it covers.", "8 x 5 = 40 cm2."], "a": 2}, {"q": "A square has sides of 6 m. What is its area?", "o": ["36 m2.", "8 x 5 = 40 cm2.", "Square units, such as cm2 or m2.", "Trace it on squared paper and count the squares it covers."], "a": 0}], "cards": [{"en": "area", "ar": "المساحة", "pr": "AIR-ee-uh", "ex": "A 4 cm by 3 cm rectangle has area 12 cm2."}, {"en": "m2", "ar": "متر مربع", "pr": "SKWAIR MEE-ter", "ex": "The room is 20 m2."}, {"en": "cm2", "ar": "سنتيمتر مربع", "pr": "SKWAIR SEN-ti-mee-ter", "ex": "A stamp is about 4 cm2."}, {"en": "irregular shape", "ar": "شكل غير منتظم", "pr": "i-REG-yuh-ler shayp", "ex": "A leaf; count squares to find its area."}]}, {"id": "2.5", "title": "How Do We Measure Volume?", "paras": ["Volume is the amount of space something takes up. The SI unit is the cubic metre (m3). We often use cm3, and for liquids millilitres (mL) and litres (L). 1 cm3 = 1 mL and 1 L = 1000 mL.", "For a regular solid (cuboid), volume = length x width x height. For liquids, use a measuring cylinder. For an irregular solid that sinks, use displacement: put water in a measuring cylinder, note the level, lower the object in, note the new level. The difference is the object's volume."], "key": ["volume", "cm3", "displacement", "measuring cylinder"], "qs": [{"q": "Find the volume of a box 5 cm x 4 cm x 3 cm.", "o": ["2000 mL.", "The displacement method.", "55 - 40 = 15 mL (15 cm3).", "5 x 4 x 3 = 60 cm3."], "a": 3}, {"q": "How many mL are in 2 L?", "o": ["55 - 40 = 15 mL (15 cm3).", "2000 mL.", "5 x 4 x 3 = 60 cm3.", "The displacement method."], "a": 1}, {"q": "Water rises from 40 mL to 55 mL when a stone is added. What is the stone's volume?", "o": ["The displacement method.", "55 - 40 = 15 mL (15 cm3).", "5 x 4 x 3 = 60 cm3.", "2000 mL."], "a": 1}, {"q": "What method measures the volume of an irregular solid?", "o": ["2000 mL.", "55 - 40 = 15 mL (15 cm3).", "5 x 4 x 3 = 60 cm3.", "The displacement method."], "a": 3}], "cards": [{"en": "volume", "ar": "الحجم", "pr": "VOL-yoom", "ex": "A box 5 x 4 x 3 cm has volume 60 cm3."}, {"en": "cm3", "ar": "سنتيمتر مكعب", "pr": "KYOO-bik SEN-ti-mee-ter", "ex": "1 cm3 equals 1 mL."}, {"en": "displacement", "ar": "الإزاحة", "pr": "dis-PLAYS-ment", "ex": "A stone raises the water level."}, {"en": "measuring cylinder", "ar": "مخبار مدرّج", "pr": "MEZH-er-ing SIL-in-der", "ex": "Measure 50 mL of water."}]}, {"id": "2.6", "title": "How Do We Measure Mass?", "paras": ["Mass is the amount of matter in an object. Its SI unit is the kilogram (kg); smaller masses use grams (g). Mass is measured with a balance, such as a beam balance or an electronic balance.", "Mass is not the same as weight. Mass stays the same everywhere, but weight is a force that depends on gravity. To find the mass of a liquid, weigh the empty container, then weigh it with the liquid, and subtract."], "key": ["mass", "kilogram", "balance", "matter"], "qs": [{"q": "What does mass measure?", "o": ["A balance.", "3500 g.", "320 - 120 = 200 g.", "The amount of matter in an object."], "a": 3}, {"q": "Which instrument measures mass?", "o": ["The amount of matter in an object.", "A balance.", "320 - 120 = 200 g.", "3500 g."], "a": 1}, {"q": "An empty beaker is 120 g. With water it is 320 g. What is the mass of the water?", "o": ["3500 g.", "320 - 120 = 200 g.", "A balance.", "The amount of matter in an object."], "a": 1}, {"q": "Convert 3.5 kg to grams.", "o": ["The amount of matter in an object.", "A balance.", "3500 g.", "320 - 120 = 200 g."], "a": 2}], "cards": [{"en": "mass", "ar": "الكتلة", "pr": "mass", "ex": "A bag of rice has a mass of 2 kg."}, {"en": "kilogram", "ar": "كيلوجرام", "pr": "KIL-oh-gram", "ex": "The SI unit of mass."}, {"en": "balance", "ar": "ميزان", "pr": "BAL-ens", "ex": "Find the mass of a stone with a balance."}, {"en": "matter", "ar": "المادة", "pr": "MAT-er", "ex": "Everything made of particles is matter."}]}, {"id": "2.7", "title": "How Do We Measure Time?", "paras": ["The SI unit of time is the second (s). Other units are minutes, hours, days and years. 1 minute = 60 s and 1 hour = 60 minutes = 3600 s.", "We measure time with clocks, watches and stopwatches. For short events, a stopwatch is best. For very short times, such as a swinging pendulum, time many swings and divide by the number of swings to get a more accurate time for one swing. Starting and stopping slightly late is human reaction error."], "key": ["time", "second", "stopwatch", "pendulum", "reaction time"], "qs": [{"q": "What is the SI unit of time?", "o": ["It reduces the effect of human reaction error and gives a more accurate result.", "The second.", "30 / 20 = 1.5 s.", "300 s."], "a": 1}, {"q": "How many seconds are in 5 minutes?", "o": ["300 s.", "30 / 20 = 1.5 s.", "It reduces the effect of human reaction error and gives a more accurate result.", "The second."], "a": 0}, {"q": "20 swings of a pendulum take 30 s. How long does one swing take?", "o": ["It reduces the effect of human reaction error and gives a more accurate result.", "30 / 20 = 1.5 s.", "The second.", "300 s."], "a": 1}, {"q": "Why time many swings instead of one?", "o": ["It reduces the effect of human reaction error and gives a more accurate result.", "The second.", "30 / 20 = 1.5 s.", "300 s."], "a": 0}], "cards": [{"en": "time", "ar": "الزمن", "pr": "tym", "ex": "The race took 12 seconds."}, {"en": "second", "ar": "ثانية", "pr": "SEK-und", "ex": "The SI unit of time."}, {"en": "stopwatch", "ar": "ساعة إيقاف", "pr": "STOP-woch", "ex": "Time a toy car with a stopwatch."}, {"en": "pendulum", "ar": "بندول", "pr": "PEN-dyoo-lum", "ex": "A swinging weight on a string."}, {"en": "reaction time", "ar": "زمن رد الفعل", "pr": "ree-AK-shun tym", "ex": "A delay when you press stop."}]}]}, {"n": 3, "title": "Living Things", "lessons": [{"id": "3.1", "title": "What Are the Characteristics of Living Things?", "paras": ["All living things carry out seven life processes. A handy memory aid is MRS GREN: Movement, Respiration, Sensitivity, Growth, Reproduction, Excretion, Nutrition.", "Movement means changing position or parts (plants move towards light by growing). Respiration releases energy from food. Sensitivity means detecting and responding to changes. Growth is getting bigger. Reproduction produces offspring. Excretion removes waste. Nutrition is getting food (animals eat, plants make food by photosynthesis)."], "key": ["MRS GREN", "respiration", "excretion", "nutrition", "sensitivity"], "qs": [{"q": "List the seven characteristics of living things.", "o": ["Movement, respiration, sensitivity, growth, reproduction, excretion, nutrition.", "It does not grow, reproduce, respond or excrete like a living thing.", "It releases energy from food.", "They make their own food by photosynthesis."], "a": 0}, {"q": "What does respiration do?", "o": ["It releases energy from food.", "They make their own food by photosynthesis.", "It does not grow, reproduce, respond or excrete like a living thing.", "Movement, respiration, sensitivity, growth, reproduction, excretion, nutrition."], "a": 0}, {"q": "How do plants get nutrition?", "o": ["It does not grow, reproduce, respond or excrete like a living thing.", "They make their own food by photosynthesis.", "Movement, respiration, sensitivity, growth, reproduction, excretion, nutrition.", "It releases energy from food."], "a": 1}, {"q": "A car moves and uses fuel. Why is it not alive?", "o": ["They make their own food by photosynthesis.", "It does not grow, reproduce, respond or excrete like a living thing.", "Movement, respiration, sensitivity, growth, reproduction, excretion, nutrition.", "It releases energy from food."], "a": 1}], "cards": [{"en": "MRS GREN", "ar": "حروف الصفات الحية السبع", "pr": "em-ar-ess GREN", "ex": "A memory aid for 7 life processes."}, {"en": "respiration", "ar": "التنفس الخلوي", "pr": "res-pi-RAY-shun", "ex": "Cells release energy from glucose."}, {"en": "excretion", "ar": "الإخراج", "pr": "ek-SKREE-shun", "ex": "Breathing out carbon dioxide."}, {"en": "nutrition", "ar": "التغذية", "pr": "new-TRISH-un", "ex": "Plants make food; animals eat it."}, {"en": "sensitivity", "ar": "الحساسية للمؤثرات", "pr": "sen-si-TIV-i-tee", "ex": "Your eyes react to bright light."}]}, {"id": "3.2", "title": "Cells: The Basic Units of Life", "paras": ["All living things are made of cells. Cells are tiny, so we use a microscope to see them. The cell is the basic unit of life.", "In a microscope, the eyepiece lens and objective lens both magnify. Total magnification = eyepiece magnification x objective magnification. A 10x eyepiece with a 40x objective gives 400x. To use one: place the slide on the stage, start with the lowest-power objective, and focus using the coarse then fine focus knobs. Never use the coarse knob with a high-power lens, as it can crack the slide."], "key": ["cell", "microscope", "magnification", "eyepiece", "objective lens"], "qs": [{"q": "What are all living things made of?", "o": ["10 x 20 = 200x.", "The stage.", "The lowest-power lens.", "Cells."], "a": 3}, {"q": "Calculate total magnification: eyepiece 10x, objective 20x.", "o": ["The stage.", "The lowest-power lens.", "10 x 20 = 200x.", "Cells."], "a": 2}, {"q": "Which objective lens do you start with?", "o": ["10 x 20 = 200x.", "Cells.", "The stage.", "The lowest-power lens."], "a": 3}, {"q": "What part of the microscope holds the slide?", "o": ["The stage.", "10 x 20 = 200x.", "The lowest-power lens.", "Cells."], "a": 0}], "cards": [{"en": "cell", "ar": "خلية", "pr": "sel", "ex": "Your body is made of cells."}, {"en": "microscope", "ar": "مجهر", "pr": "MY-kruh-skohp", "ex": "See onion cells with a microscope."}, {"en": "magnification", "ar": "التكبير", "pr": "mag-ni-fi-KAY-shun", "ex": "10x eyepiece and 40x lens gives 400x."}, {"en": "eyepiece", "ar": "العدسة العينية", "pr": "EYE-pees", "ex": "The lens you look through."}, {"en": "objective lens", "ar": "العدسة الشيئية", "pr": "ob-JEK-tiv lenz", "ex": "Start with the lowest-power one."}]}, {"id": "3.3", "title": "Plant and Animal Cells", "paras": ["Both plant and animal cells have a nucleus, cytoplasm and cell membrane. The nucleus controls the cell's activities. Cytoplasm is the jelly where reactions happen. The cell membrane controls what enters and leaves. Mitochondria release energy.", "Plant cells also have a cell wall (strong, made of cellulose, gives support), chloroplasts (contain chlorophyll, where photosynthesis happens) and often a large vacuole full of cell sap. Animal cells do not have these."], "key": ["nucleus", "cytoplasm", "cell membrane", "cell wall", "chloroplast", "vacuole"], "qs": [{"q": "Which part controls the cell's activities?", "o": ["They carry out photosynthesis (they contain chlorophyll).", "The nucleus.", "Controls what goes in and out of the cell.", "Cell wall, chloroplasts, large vacuole."], "a": 1}, {"q": "Name three structures found in plant cells but not animal cells.", "o": ["Controls what goes in and out of the cell.", "Cell wall, chloroplasts, large vacuole.", "They carry out photosynthesis (they contain chlorophyll).", "The nucleus."], "a": 1}, {"q": "What is the job of chloroplasts?", "o": ["They carry out photosynthesis (they contain chlorophyll).", "Controls what goes in and out of the cell.", "Cell wall, chloroplasts, large vacuole.", "The nucleus."], "a": 0}, {"q": "What does the cell membrane do?", "o": ["Cell wall, chloroplasts, large vacuole.", "They carry out photosynthesis (they contain chlorophyll).", "Controls what goes in and out of the cell.", "The nucleus."], "a": 2}], "cards": [{"en": "nucleus", "ar": "النواة", "pr": "NYOO-klee-us", "ex": "It controls the cell."}, {"en": "cytoplasm", "ar": "السيتوبلازم", "pr": "SY-toh-plaz-um", "ex": "The jelly where reactions happen."}, {"en": "cell membrane", "ar": "الغشاء الخلوي", "pr": "sel MEM-brayn", "ex": "Controls what enters the cell."}, {"en": "cell wall", "ar": "الجدار الخلوي", "pr": "sel wawl", "ex": "Gives a plant cell strength."}, {"en": "chloroplast", "ar": "البلاستيدة الخضراء", "pr": "KLOR-uh-plast", "ex": "Where photosynthesis happens."}, {"en": "vacuole", "ar": "الفجوة", "pr": "VAK-yoo-ohl", "ex": "Stores cell sap in plant cells."}]}, {"id": "3.4", "title": "Do Different Types of Cells Have Different Functions?", "paras": ["Cells are specialised: their shape helps them do a particular job. A red blood cell is a disc with no nucleus, so it carries more oxygen. A nerve cell is long to carry messages. A muscle cell can contract to cause movement. A root hair cell has a long extension to take in water. A palisade cell in a leaf has many chloroplasts for photosynthesis. A sperm cell has a tail to swim, and an egg cell is large with food store."], "key": ["specialised cell", "red blood cell", "nerve cell", "root hair cell", "palisade cell"], "qs": [{"q": "Why is a nerve cell long?", "o": ["Its structure is adapted for a particular job.", "To absorb lots of light for photosynthesis.", "To carry electrical messages over a distance.", "The root hair cell."], "a": 2}, {"q": "Which cell takes in water for a plant?", "o": ["The root hair cell.", "To absorb lots of light for photosynthesis.", "Its structure is adapted for a particular job.", "To carry electrical messages over a distance."], "a": 0}, {"q": "Why do palisade cells have many chloroplasts?", "o": ["To carry electrical messages over a distance.", "The root hair cell.", "Its structure is adapted for a particular job.", "To absorb lots of light for photosynthesis."], "a": 3}, {"q": "What does it mean for a cell to be specialised?", "o": ["To absorb lots of light for photosynthesis.", "The root hair cell.", "Its structure is adapted for a particular job.", "To carry electrical messages over a distance."], "a": 2}], "cards": [{"en": "specialised cell", "ar": "خلية متخصصة", "pr": "SPESH-uh-lyzd sel", "ex": "A nerve cell is long to carry messages."}, {"en": "red blood cell", "ar": "خلية دم حمراء", "pr": "red blud sel", "ex": "Carries oxygen."}, {"en": "nerve cell", "ar": "خلية عصبية", "pr": "nerv sel", "ex": "Carries electrical messages."}, {"en": "root hair cell", "ar": "خلية الشعيرة الجذرية", "pr": "root hair sel", "ex": "Absorbs water from soil."}, {"en": "palisade cell", "ar": "خلية عمادية", "pr": "PAL-i-sayd sel", "ex": "Has many chloroplasts in a leaf."}]}, {"id": "3.5", "title": "How Are Cells Organised to Form an Organism?", "paras": ["Cells are organised in levels: cell, tissue, organ, organ system, organism. A group of similar cells doing the same job is a tissue (for example muscle tissue). Different tissues working together form an organ (the heart). Organs working together form an organ system (the circulatory system). All the systems together make up an organism.", "Plants also have organs, such as roots, stems and leaves."], "key": ["tissue", "organ", "organ system", "organism"], "qs": [{"q": "Put in order: organ, cell, organism, tissue, organ system.", "o": ["A group of similar cells that do the same job.", "Examples: digestive, circulatory, respiratory.", "Leaf, stem or root.", "Cell, tissue, organ, organ system, organism."], "a": 3}, {"q": "What is a tissue?", "o": ["Examples: digestive, circulatory, respiratory.", "Leaf, stem or root.", "Cell, tissue, organ, organ system, organism.", "A group of similar cells that do the same job."], "a": 3}, {"q": "Name an organ of a plant.", "o": ["Examples: digestive, circulatory, respiratory.", "A group of similar cells that do the same job.", "Leaf, stem or root.", "Cell, tissue, organ, organ system, organism."], "a": 2}, {"q": "Name an organ system in humans.", "o": ["Examples: digestive, circulatory, respiratory.", "A group of similar cells that do the same job.", "Cell, tissue, organ, organ system, organism.", "Leaf, stem or root."], "a": 0}], "cards": [{"en": "tissue", "ar": "نسيج", "pr": "TISH-oo", "ex": "Muscle tissue is a group of muscle cells."}, {"en": "organ", "ar": "عضو", "pr": "OR-gun", "ex": "The heart is an organ."}, {"en": "organ system", "ar": "جهاز عضوي", "pr": "OR-gun SIS-tem", "ex": "The digestive system."}, {"en": "organism", "ar": "كائن حي", "pr": "OR-guh-niz-um", "ex": "A dog is an organism."}]}, {"id": "3.6", "title": "The Human Skeleton and Joints", "paras": ["The skeleton supports the body, protects organs (the skull protects the brain, ribs protect the heart and lungs), allows movement and makes blood cells in bone marrow.", "Joints are where bones meet. Ball-and-socket joints (shoulder, hip) move in many directions. Hinge joints (knee, elbow) move in one direction. Fixed joints (skull) do not move. Ligaments join bone to bone, cartilage cushions the ends of bones, and synovial fluid lubricates the joint."], "key": ["skeleton", "joint", "ligament", "cartilage", "ball-and-socket", "hinge"], "qs": [{"q": "Name two functions of the skeleton.", "o": ["A hinge joint.", "The ribs.", "Connect bone to bone.", "Support, protection, movement, making blood cells."], "a": 3}, {"q": "Which type of joint is the knee?", "o": ["The ribs.", "Connect bone to bone.", "Support, protection, movement, making blood cells.", "A hinge joint."], "a": 3}, {"q": "What do ligaments do?", "o": ["Support, protection, movement, making blood cells.", "A hinge joint.", "Connect bone to bone.", "The ribs."], "a": 2}, {"q": "Which bones protect the heart and lungs?", "o": ["A hinge joint.", "Support, protection, movement, making blood cells.", "The ribs.", "Connect bone to bone."], "a": 2}], "cards": [{"en": "skeleton", "ar": "الهيكل العظمي", "pr": "SKEL-i-tun", "ex": "Supports and protects the body."}, {"en": "joint", "ar": "مفصل", "pr": "joynt", "ex": "The knee is a joint."}, {"en": "ligament", "ar": "رباط", "pr": "LIG-uh-ment", "ex": "Joins bone to bone."}, {"en": "cartilage", "ar": "غضروف", "pr": "KAR-ti-lij", "ex": "Cushions the ends of bones."}, {"en": "ball-and-socket", "ar": "مفصل كروي", "pr": "bawl-and-SOK-it", "ex": "The shoulder joint."}, {"en": "hinge", "ar": "مفصل رزّي", "pr": "hinj", "ex": "The elbow joint."}]}, {"id": "3.7", "title": "The Human Muscles", "paras": ["Muscles are attached to bones by tendons. Muscles can only pull by contracting (getting shorter), never push. So they work in pairs called antagonistic muscles. In the arm, the biceps contracts to bend the arm while the triceps relaxes. To straighten, the triceps contracts and the biceps relaxes. Exercise makes muscles stronger."], "key": ["muscle", "tendon", "contract", "relax", "biceps", "triceps"], "qs": [{"q": "What joins muscle to bone?", "o": ["The biceps.", "It relaxes.", "Muscles can only pull, so one is needed to pull each way.", "Tendons."], "a": 3}, {"q": "Why do muscles work in pairs?", "o": ["Muscles can only pull, so one is needed to pull each way.", "The biceps.", "It relaxes.", "Tendons."], "a": 0}, {"q": "Which muscle contracts to bend the arm?", "o": ["It relaxes.", "The biceps.", "Muscles can only pull, so one is needed to pull each way.", "Tendons."], "a": 1}, {"q": "What happens to the triceps when the arm bends?", "o": ["Muscles can only pull, so one is needed to pull each way.", "It relaxes.", "The biceps.", "Tendons."], "a": 1}], "cards": [{"en": "muscle", "ar": "عضلة", "pr": "MUS-ul", "ex": "The biceps is a muscle."}, {"en": "tendon", "ar": "وتر", "pr": "TEN-dun", "ex": "Joins muscle to bone."}, {"en": "contract", "ar": "ينقبض", "pr": "kun-TRAKT", "ex": "The biceps contracts to bend the arm."}, {"en": "relax", "ar": "يسترخي", "pr": "ri-LAKS", "ex": "The triceps relaxes when the arm bends."}, {"en": "biceps", "ar": "العضلة ذات الرأسين", "pr": "BY-seps", "ex": "Bends the arm."}, {"en": "triceps", "ar": "العضلة ثلاثية الرؤوس", "pr": "TRY-seps", "ex": "Straightens the arm."}]}, {"id": "3.8", "title": "What Do Scientists Study About the Human Body?", "paras": ["Scientists study the body to understand how it works and to treat disease. Physiologists study how organs work. Doctors and researchers use tools such as X-rays, scans and microscopes. Studying the body helps develop medicines, replacement joints and treatments, and helps people to stay healthy through food, exercise and rest.", "Scientists also study the effect of lifestyle, such as smoking, on health, using data and careful tests."], "key": ["physiology", "X-ray", "health", "research"], "qs": [{"q": "Name one tool used to look inside the body.", "o": ["Examples: balanced diet, exercise, enough sleep.", "The stage.", "To understand how it works and develop treatments.", "X-ray or scan."], "a": 3}, {"q": "Why do scientists study the human body?", "o": ["To understand how it works and develop treatments.", "X-ray or scan.", "Examples: balanced diet, exercise, enough sleep.", "Cell, tissue, organ, organ system, organism."], "a": 0}, {"q": "Give one lifestyle choice that keeps the body healthy.", "o": ["Examples: balanced diet, exercise, enough sleep.", "Support, protection, movement, making blood cells.", "To understand how it works and develop treatments.", "X-ray or scan."], "a": 0}], "cards": [{"en": "physiology", "ar": "علم وظائف الأعضاء", "pr": "fiz-ee-OL-uh-jee", "ex": "Studies how organs work."}, {"en": "X-ray", "ar": "أشعة سينية", "pr": "EKS-ray", "ex": "Shows a broken bone."}, {"en": "health", "ar": "الصحة", "pr": "helth", "ex": "Exercise helps your health."}, {"en": "research", "ar": "بحث علمي", "pr": "ri-SERCH", "ex": "Research finds new medicines."}]}]}, {"n": 4, "title": "Microorganisms", "lessons": [{"id": "4.1", "title": "What Are Microorganisms?", "paras": ["Microorganisms (microbes) are living things too small to see without a microscope. The main groups are bacteria, fungi (such as yeast and mould) and viruses. Some are useful and some cause disease.", "Bacteria are single-celled with no nucleus. Fungi can be single-celled (yeast) or multicellular (mushroom, mould). Viruses are much smaller and can only reproduce inside living cells. Microbes live almost everywhere: soil, water, air and on our bodies."], "key": ["microorganism", "bacteria", "fungi", "virus", "yeast"], "qs": [{"q": "Name the three main types of microorganism.", "o": ["Bacteria, fungi and viruses.", "Yeast.", "Only inside living cells.", "They are too small to see with the eye."], "a": 0}, {"q": "Why do we need a microscope to see microorganisms?", "o": ["Only inside living cells.", "They are too small to see with the eye.", "Bacteria, fungi and viruses.", "Yeast."], "a": 1}, {"q": "Which is a single-celled fungus?", "o": ["Bacteria, fungi and viruses.", "They are too small to see with the eye.", "Only inside living cells.", "Yeast."], "a": 3}, {"q": "Where can viruses reproduce?", "o": ["Only inside living cells.", "Bacteria, fungi and viruses.", "Yeast.", "They are too small to see with the eye."], "a": 0}], "cards": [{"en": "microorganism", "ar": "كائن دقيق", "pr": "my-kroh-OR-guh-niz-um", "ex": "Bacteria are microorganisms."}, {"en": "bacteria", "ar": "بكتيريا", "pr": "bak-TEER-ee-uh", "ex": "Some bacteria turn milk into yoghurt."}, {"en": "fungi", "ar": "فطريات", "pr": "FUN-jy", "ex": "Mould is a fungus."}, {"en": "virus", "ar": "فيروس", "pr": "VY-rus", "ex": "A virus causes flu."}, {"en": "yeast", "ar": "خميرة", "pr": "yeest", "ex": "Makes bread rise."}]}, {"id": "4.2", "title": "Microorganisms and Decay", "paras": ["Decay is the breakdown of dead plants and animals by decomposers such as bacteria and fungi. They release enzymes that break down dead matter and absorb the nutrients. Decay returns minerals to the soil so plants can use them again.", "Decay is fastest when it is warm, moist and has oxygen. Cold, dry or airless conditions slow it down. This is why we keep food in the fridge."], "key": ["decay", "decomposer", "nutrients", "moisture", "warmth"], "qs": [{"q": "What are decomposers?", "o": ["It returns nutrients to the soil.", "Warm, moist, with oxygen.", "Microorganisms that break down dead material.", "Cold slows the growth of microbes."], "a": 2}, {"q": "Why is decay useful?", "o": ["Cold slows the growth of microbes.", "Warm, moist, with oxygen.", "Microorganisms that break down dead material.", "It returns nutrients to the soil."], "a": 3}, {"q": "Which conditions make decay fastest?", "o": ["Cold slows the growth of microbes.", "Warm, moist, with oxygen.", "Microorganisms that break down dead material.", "It returns nutrients to the soil."], "a": 1}, {"q": "Why does a fridge keep food fresh longer?", "o": ["Microorganisms that break down dead material.", "It returns nutrients to the soil.", "Warm, moist, with oxygen.", "Cold slows the growth of microbes."], "a": 3}], "cards": [{"en": "decay", "ar": "التحلل", "pr": "di-KAY", "ex": "A fallen leaf decays."}, {"en": "decomposer", "ar": "محلل", "pr": "dee-kum-POH-zer", "ex": "Fungi are decomposers."}, {"en": "nutrients", "ar": "مواد مغذية", "pr": "NYOO-tree-ents", "ex": "Decay returns nutrients to soil."}, {"en": "moisture", "ar": "رطوبة", "pr": "MOYS-cher", "ex": "Damp conditions speed up decay."}, {"en": "warmth", "ar": "دفء", "pr": "wormth", "ex": "Food rots faster in warmth."}]}, {"id": "4.3", "title": "Microorganisms and Food Production", "paras": ["Many foods need microorganisms. Yeast makes bread rise: it respires and releases carbon dioxide gas, which makes bubbles in the dough. Yeast also makes alcohol by fermentation. Bacteria turn milk into yoghurt and cheese.", "Food can also be preserved from harmful microbes by cooling, freezing, drying, salting, canning or pickling."], "key": ["yeast", "fermentation", "yoghurt", "preserve"], "qs": [{"q": "Which gas makes bread dough rise?", "o": ["Bacteria.", "Freezing, drying, salting, canning, pickling.", "Carbon dioxide.", "Yeast works faster when warm."], "a": 2}, {"q": "Which microorganisms turn milk into yoghurt?", "o": ["Freezing, drying, salting, canning, pickling.", "Bacteria.", "Yeast works faster when warm.", "Carbon dioxide."], "a": 1}, {"q": "Name two ways to preserve food.", "o": ["Carbon dioxide.", "Bacteria.", "Freezing, drying, salting, canning, pickling.", "Yeast works faster when warm."], "a": 2}, {"q": "Why is a warm place good for dough?", "o": ["Yeast works faster when warm.", "Freezing, drying, salting, canning, pickling.", "Carbon dioxide.", "Bacteria."], "a": 0}], "cards": [{"en": "yeast", "ar": "خميرة", "pr": "yeest", "ex": "Makes bread rise."}, {"en": "fermentation", "ar": "التخمر", "pr": "fer-men-TAY-shun", "ex": "Yeast turns sugar into alcohol and gas."}, {"en": "yoghurt", "ar": "زبادي", "pr": "YOG-urt", "ex": "Made from milk by bacteria."}, {"en": "preserve", "ar": "يحفظ", "pr": "pri-ZURV", "ex": "Freezing preserves food."}]}, {"id": "4.4", "title": "Microorganisms and Disease", "paras": ["Microorganisms that cause disease are called pathogens. Bacteria cause diseases such as food poisoning and tetanus. Viruses cause colds, flu and measles. Fungi cause athlete's foot.", "Pathogens spread through air (coughs and sneezes), touch, dirty water, contaminated food and animals such as mosquitoes. We can stop spread by washing hands, covering coughs, clean water, safe food storage and vaccination. The body's white blood cells fight pathogens. Antibiotics kill bacteria but do not work on viruses."], "key": ["pathogen", "vaccination", "antibiotic", "hygiene"], "qs": [{"q": "What is a pathogen?", "o": ["A microorganism that causes disease.", "Air, touch, water, food, animals.", "No, only on bacteria.", "Washing hands, vaccination, clean water, covering coughs."], "a": 0}, {"q": "Name one way diseases spread.", "o": ["Washing hands, vaccination, clean water, covering coughs.", "No, only on bacteria.", "Air, touch, water, food, animals.", "A microorganism that causes disease."], "a": 2}, {"q": "Do antibiotics work on viruses?", "o": ["Washing hands, vaccination, clean water, covering coughs.", "Air, touch, water, food, animals.", "No, only on bacteria.", "A microorganism that causes disease."], "a": 2}, {"q": "Give two ways to prevent infection.", "o": ["No, only on bacteria.", "Washing hands, vaccination, clean water, covering coughs.", "A microorganism that causes disease.", "Air, touch, water, food, animals."], "a": 1}], "cards": [{"en": "pathogen", "ar": "مسبب مرض", "pr": "PATH-uh-jen", "ex": "A virus is a pathogen."}, {"en": "vaccination", "ar": "التطعيم", "pr": "vak-si-NAY-shun", "ex": "Protects you from measles."}, {"en": "antibiotic", "ar": "مضاد حيوي", "pr": "an-ti-by-OT-ik", "ex": "Kills bacteria, not viruses."}, {"en": "hygiene", "ar": "النظافة الصحية", "pr": "HY-jeen", "ex": "Washing hands is good hygiene."}]}, {"id": "4.5", "title": "The Works of Louis Pasteur", "paras": ["Louis Pasteur (1822-1895) was a French scientist. He showed that microorganisms in the air cause food to spoil and that they do not appear from nothing. He found that heating liquids such as milk to kill microbes keeps them fresh longer. This is called pasteurisation.", "He also developed vaccines, including one for rabies, and showed that germs cause disease, which led to cleaner medical practice."], "key": ["Pasteur", "pasteurisation", "vaccine", "germs"], "qs": [{"q": "What is pasteurisation?", "o": ["Microorganisms from the air.", "Heating a liquid to kill microorganisms so it lasts longer.", "Rabies.", "They are too small to see with the eye."], "a": 1}, {"q": "Which disease did Pasteur make a vaccine for?", "o": ["Carbon dioxide.", "Rabies.", "Microorganisms from the air.", "Heating a liquid to kill microorganisms so it lasts longer."], "a": 1}, {"q": "What did Pasteur show causes food to spoil?", "o": ["Heating a liquid to kill microorganisms so it lasts longer.", "Only inside living cells.", "Rabies.", "Microorganisms from the air."], "a": 3}], "cards": [{"en": "Pasteur", "ar": "باستور", "pr": "pas-TUR", "ex": "Louis Pasteur, French scientist."}, {"en": "pasteurisation", "ar": "البسترة", "pr": "pas-chur-eye-ZAY-shun", "ex": "Heating milk to kill microbes."}, {"en": "vaccine", "ar": "لقاح", "pr": "vak-SEEN", "ex": "Pasteur made one for rabies."}, {"en": "germs", "ar": "جراثيم", "pr": "jurmz", "ex": "Germs cause disease."}]}]}, {"n": 5, "title": "Habitats and Environment", "lessons": [{"id": "5.1", "title": "How Organisms Adapt to Their Habitats", "paras": ["A habitat is where an organism lives. An adaptation is a feature that helps an organism survive there. A camel stores fat in its hump and has wide feet for sand. A polar bear has thick fur and fat for the cold and white fur for camouflage. A cactus has spines, thick stems that store water, and a waxy surface. Fish have gills and streamlined bodies.", "A population is all the organisms of one species in a habitat. A community is all the populations living together. An ecosystem is the community plus its non-living surroundings."], "key": ["habitat", "adaptation", "camouflage", "population", "community", "ecosystem"], "qs": [{"q": "What is an adaptation?", "o": ["The place where an organism lives.", "Camouflage in snow.", "A feature that helps an organism survive in its habitat.", "Spines, thick water-storing stem, waxy surface."], "a": 2}, {"q": "Give an adaptation of a cactus.", "o": ["The place where an organism lives.", "Camouflage in snow.", "Spines, thick water-storing stem, waxy surface.", "A feature that helps an organism survive in its habitat."], "a": 2}, {"q": "What is a habitat?", "o": ["Spines, thick water-storing stem, waxy surface.", "Camouflage in snow.", "A feature that helps an organism survive in its habitat.", "The place where an organism lives."], "a": 3}, {"q": "Why is a polar bear's fur white?", "o": ["A feature that helps an organism survive in its habitat.", "The place where an organism lives.", "Spines, thick water-storing stem, waxy surface.", "Camouflage in snow."], "a": 3}], "cards": [{"en": "habitat", "ar": "موطن", "pr": "HAB-i-tat", "ex": "A desert is a habitat."}, {"en": "adaptation", "ar": "تكيف", "pr": "ad-ap-TAY-shun", "ex": "A camel's wide feet are an adaptation."}, {"en": "camouflage", "ar": "تمويه", "pr": "KAM-uh-flahzh", "ex": "A polar bear's white fur."}, {"en": "population", "ar": "مجموعة سكانية", "pr": "pop-yoo-LAY-shun", "ex": "All the frogs in a pond."}, {"en": "community", "ar": "مجتمع حيوي", "pr": "kuh-MYOO-ni-tee", "ex": "All living things in a pond."}, {"en": "ecosystem", "ar": "نظام بيئي", "pr": "EE-koh-sis-tum", "ex": "A pond and its living things."}]}, {"id": "5.2", "title": "What Are Food Chains?", "paras": ["A food chain shows the flow of energy as one organism eats another. It starts with a producer, a green plant that makes food by photosynthesis. Consumers eat other organisms: herbivores eat plants (primary consumers), carnivores eat animals (secondary and tertiary), and omnivores eat both. Arrows point in the direction of energy flow, so they point from the food to the eater.", "Example: grass, grasshopper, frog, snake. A food web is many linked food chains. The energy originally comes from the Sun. Decomposers break down dead matter."], "key": ["producer", "consumer", "herbivore", "carnivore", "food web"], "qs": [{"q": "What do the arrows in a food chain show?", "o": ["An animal that eats only plants.", "Grass.", "The direction of energy flow, from food to eater.", "The Sun."], "a": 2}, {"q": "Name the producer in: grass, rabbit, fox.", "o": ["An animal that eats only plants.", "Grass.", "The Sun.", "The direction of energy flow, from food to eater."], "a": 1}, {"q": "What is a herbivore?", "o": ["Grass.", "An animal that eats only plants.", "The direction of energy flow, from food to eater.", "The Sun."], "a": 1}, {"q": "What is the original source of energy for food chains?", "o": ["The direction of energy flow, from food to eater.", "An animal that eats only plants.", "Grass.", "The Sun."], "a": 3}], "cards": [{"en": "producer", "ar": "منتج", "pr": "pruh-DYOO-ser", "ex": "Grass makes its own food."}, {"en": "consumer", "ar": "مستهلك", "pr": "kun-SYOO-mer", "ex": "A frog eats insects."}, {"en": "herbivore", "ar": "آكل أعشاب", "pr": "HER-bi-vor", "ex": "A rabbit eats only plants."}, {"en": "carnivore", "ar": "آكل لحوم", "pr": "KAR-ni-vor", "ex": "A lion eats animals."}, {"en": "food web", "ar": "شبكة غذائية", "pr": "food web", "ex": "Linked food chains."}]}, {"id": "5.3", "title": "Effects of Human Activities on Food Chains", "paras": ["Human activities can upset food chains. Overhunting or overfishing can remove a species, so others that depend on it suffer. Pesticides sprayed on crops can poison insects and pass along the food chain, building up in top predators. Removing a species can cause its prey to increase too much.", "Introducing a new species may harm local species. These changes can reduce biodiversity."], "key": ["pesticide", "overfishing", "biodiversity", "food chain"], "qs": [{"q": "How can overfishing harm a food chain?", "o": ["The variety of living things in an area.", "The poison passes along the food chain and builds up in it.", "It reduces the fish, so animals that eat them lose food.", "They take millions of years to form and will run out."], "a": 2}, {"q": "How can pesticides affect a predator?", "o": ["It reduces the fish, so animals that eat them lose food.", "The poison passes along the food chain and builds up in it.", "The variety of living things in an area.", "They take millions of years to form and will run out."], "a": 1}, {"q": "What is biodiversity?", "o": ["The poison passes along the food chain and builds up in it.", "The variety of living things in an area.", "Air pollution from burning fuels.", "It reduces the fish, so animals that eat them lose food."], "a": 1}], "cards": [{"en": "pesticide", "ar": "مبيد حشري", "pr": "PES-ti-syd", "ex": "Sprayed on crops to kill insects."}, {"en": "overfishing", "ar": "الصيد الجائر", "pr": "oh-ver-FISH-ing", "ex": "Too many fish are caught."}, {"en": "biodiversity", "ar": "التنوع الحيوي", "pr": "by-oh-dy-VER-si-tee", "ex": "A rainforest has high biodiversity."}, {"en": "food chain", "ar": "سلسلة غذائية", "pr": "food chain", "ex": "Grass, rabbit, fox."}]}, {"id": "5.4", "title": "Negative Effects of Human Activities on the Environment", "paras": ["Human activities cause pollution. Air pollution comes from vehicles and factories and can cause breathing problems and acid rain. Water pollution comes from sewage, oil spills and chemicals. Land pollution comes from rubbish and chemicals.", "Deforestation (cutting down forests) destroys habitats and increases carbon dioxide. Burning fossil fuels releases carbon dioxide that adds to global warming, a rise in the Earth's average temperature that melts ice and raises sea level."], "key": ["pollution", "deforestation", "global warming", "acid rain"], "qs": [{"q": "Name three types of pollution.", "o": ["Air, water and land pollution.", "Carbon dioxide.", "Air pollution from burning fuels.", "It destroys habitats and removes trees that absorb carbon dioxide."], "a": 0}, {"q": "What gas from burning fossil fuels causes global warming?", "o": ["It destroys habitats and removes trees that absorb carbon dioxide.", "Air, water and land pollution.", "Carbon dioxide.", "Air pollution from burning fuels."], "a": 2}, {"q": "Why is deforestation harmful?", "o": ["It destroys habitats and removes trees that absorb carbon dioxide.", "Air pollution from burning fuels.", "Carbon dioxide.", "Air, water and land pollution."], "a": 0}, {"q": "What is a cause of acid rain?", "o": ["Air, water and land pollution.", "Air pollution from burning fuels.", "It destroys habitats and removes trees that absorb carbon dioxide.", "Carbon dioxide."], "a": 1}], "cards": [{"en": "pollution", "ar": "التلوث", "pr": "puh-LOO-shun", "ex": "Smoke pollutes the air."}, {"en": "deforestation", "ar": "إزالة الغابات", "pr": "dee-for-i-STAY-shun", "ex": "Cutting down forests."}, {"en": "global warming", "ar": "الاحتباس الحراري", "pr": "GLOH-bul WOR-ming", "ex": "Rising temperature of the Earth."}, {"en": "acid rain", "ar": "المطر الحمضي", "pr": "AS-id rayn", "ex": "Damages stone buildings."}]}, {"id": "5.5", "title": "How Can We Conserve Our Environment?", "paras": ["Conservation means protecting and looking after the environment. We can follow the three Rs: reduce, reuse and recycle. Other actions include planting trees, creating nature reserves and national parks, saving water and energy, using public transport, laws against hunting endangered species and cleaning up pollution. Everyone, including individuals, communities and governments, has a role."], "key": ["conservation", "reduce", "reuse", "recycle", "nature reserve"], "qs": [{"q": "What do the three Rs stand for?", "o": ["Protecting wildlife and habitats.", "Switch off lights, use less heating or AC, use efficient appliances.", "Reduce, reuse, recycle.", "They give habitats, absorb carbon dioxide and prevent soil loss."], "a": 2}, {"q": "Give two ways to save energy at home.", "o": ["They give habitats, absorb carbon dioxide and prevent soil loss.", "Reduce, reuse, recycle.", "Switch off lights, use less heating or AC, use efficient appliances.", "Protecting wildlife and habitats."], "a": 2}, {"q": "What is a nature reserve for?", "o": ["Reduce, reuse, recycle.", "Switch off lights, use less heating or AC, use efficient appliances.", "Protecting wildlife and habitats.", "They give habitats, absorb carbon dioxide and prevent soil loss."], "a": 2}, {"q": "Why plant trees?", "o": ["Protecting wildlife and habitats.", "Reduce, reuse, recycle.", "They give habitats, absorb carbon dioxide and prevent soil loss.", "Switch off lights, use less heating or AC, use efficient appliances."], "a": 2}], "cards": [{"en": "conservation", "ar": "الحفاظ على البيئة", "pr": "kon-ser-VAY-shun", "ex": "Protecting nature reserves."}, {"en": "reduce", "ar": "يقلل", "pr": "ri-DYOOS", "ex": "Use less plastic."}, {"en": "reuse", "ar": "يعيد الاستخدام", "pr": "ree-YOOZ", "ex": "Use a bottle again."}, {"en": "recycle", "ar": "يعيد التدوير", "pr": "ree-SY-kul", "ex": "Recycle paper."}, {"en": "nature reserve", "ar": "محمية طبيعية", "pr": "NAY-cher ri-ZURV", "ex": "Protects wildlife."}]}, {"id": "5.6", "title": "Energy Resources", "paras": ["Non-renewable resources will run out: coal, oil and natural gas (fossil fuels formed from dead organisms over millions of years). Burning them pollutes the air. Renewable resources do not run out: solar, wind, hydroelectric (water), geothermal and biomass.", "Renewable energy causes less pollution but may depend on weather or place. Solar needs sunlight and wind needs wind."], "key": ["renewable", "non-renewable", "fossil fuel", "solar", "wind"], "qs": [{"q": "Name three fossil fuels.", "o": ["The Sun's energy will not run out.", "They take millions of years to form and will run out.", "Coal, oil, natural gas.", "It only works when it is windy."], "a": 2}, {"q": "Why is solar energy renewable?", "o": ["They take millions of years to form and will run out.", "Coal, oil, natural gas.", "The Sun's energy will not run out.", "It only works when it is windy."], "a": 2}, {"q": "Give one disadvantage of wind power.", "o": ["It only works when it is windy.", "The Sun's energy will not run out.", "They take millions of years to form and will run out.", "Coal, oil, natural gas."], "a": 0}, {"q": "Why are fossil fuels non-renewable?", "o": ["Coal, oil, natural gas.", "The Sun's energy will not run out.", "They take millions of years to form and will run out.", "It only works when it is windy."], "a": 2}], "cards": [{"en": "renewable", "ar": "متجدد", "pr": "ri-NYOO-uh-bul", "ex": "Solar energy."}, {"en": "non-renewable", "ar": "غير متجدد", "pr": "non-ri-NYOO-uh-bul", "ex": "Coal will run out."}, {"en": "fossil fuel", "ar": "وقود أحفوري", "pr": "FOS-ul FYOO-ul", "ex": "Oil, coal, natural gas."}, {"en": "solar", "ar": "شمسي", "pr": "SOH-ler", "ex": "Solar panels use sunlight."}, {"en": "wind", "ar": "رياح", "pr": "wind", "ex": "Wind turbines make electricity."}]}]}, {"n": 6, "title": "Classifying Plants and Animals", "lessons": [{"id": "6.1", "title": "Classifying Living Things", "paras": ["Classification means sorting living things into groups based on features. It makes studying them easier. The big groups are called kingdoms, such as animals, plants, fungi and microorganisms. A classification key (dichotomous key) uses a series of yes/no questions about features to identify an organism."], "key": ["classification", "kingdom", "key", "feature"], "qs": [{"q": "What is classification?", "o": ["Identifying an organism by answering questions about its features.", "Organisms that can breed together and produce fertile offspring.", "Animals and plants (also fungi, microorganisms).", "Sorting living things into groups based on features."], "a": 3}, {"q": "Name two kingdoms.", "o": ["Animals and plants (also fungi, microorganisms).", "Sorting living things into groups based on features.", "Identifying an organism by answering questions about its features.", "Monocots and dicots."], "a": 0}, {"q": "What is a key used for?", "o": ["Monocots and dicots.", "Identifying an organism by answering questions about its features.", "Sorting living things into groups based on features.", "Animals and plants (also fungi, microorganisms)."], "a": 1}], "cards": [{"en": "classification", "ar": "التصنيف", "pr": "klas-i-fi-KAY-shun", "ex": "Sorting animals into groups."}, {"en": "kingdom", "ar": "مملكة", "pr": "KING-dum", "ex": "The animal kingdom."}, {"en": "key", "ar": "مفتاح تصنيف", "pr": "kee", "ex": "A key identifies a leaf."}, {"en": "feature", "ar": "صفة مميزة", "pr": "FEE-cher", "ex": "Feathers are a feature of birds."}]}, {"id": "6.2", "title": "What Is a Species?", "paras": ["A species is a group of organisms that can breed together and produce fertile offspring. A horse and a donkey can breed to produce a mule, but a mule is usually infertile, so they are different species. Each species has a scientific name in two parts (binomial name), using Latin: genus first with capital letter, then species. Humans are Homo sapiens."], "key": ["species", "fertile", "offspring", "binomial name"], "qs": [{"q": "Define species.", "o": ["Homo sapiens.", "Organisms that can breed together and produce fertile offspring.", "Sorting living things into groups based on features.", "Their offspring (mules) are infertile."], "a": 1}, {"q": "Why are horses and donkeys different species?", "o": ["Organisms that can breed together and produce fertile offspring.", "Their offspring (mules) are infertile.", "Vertebrates have a backbone; invertebrates do not.", "Homo sapiens."], "a": 1}, {"q": "What is the scientific name for humans?", "o": ["Homo sapiens.", "Continuous.", "Their offspring (mules) are infertile.", "Organisms that can breed together and produce fertile offspring."], "a": 0}], "cards": [{"en": "species", "ar": "نوع (أنواع)", "pr": "SPEE-sheez", "ex": "Humans are one species."}, {"en": "fertile", "ar": "خصب", "pr": "FUR-tyl", "ex": "Fertile offspring can breed."}, {"en": "offspring", "ar": "نسل", "pr": "OF-spring", "ex": "A puppy is a dog's offspring."}, {"en": "binomial name", "ar": "الاسم العلمي", "pr": "by-NOH-mee-ul naym", "ex": "Homo sapiens."}]}, {"id": "6.3", "title": "Is There Variation in a Species?", "paras": ["Variation means differences between individuals of the same species. Examples are height, eye colour and hair colour in humans. Some variation is continuous (a range, such as height or mass) and some is discontinuous (distinct groups, such as blood group or whether you can roll your tongue).", "Variation is caused by inherited genes and by the environment (for example diet and sunlight)."], "key": ["variation", "continuous", "discontinuous", "inherited"], "qs": [{"q": "What is variation?", "o": ["Differences between individuals of the same species.", "Genes (inheritance) or environment.", "Sorting living things into groups based on features.", "Continuous."], "a": 0}, {"q": "Is height continuous or discontinuous?", "o": ["Differences between individuals of the same species.", "Genes (inheritance) or environment.", "Continuous.", "By spores."], "a": 2}, {"q": "Give one cause of variation.", "o": ["Differences between individuals of the same species.", "Animals and plants (also fungi, microorganisms).", "Continuous.", "Genes (inheritance) or environment."], "a": 3}], "cards": [{"en": "variation", "ar": "التباين", "pr": "vair-ee-AY-shun", "ex": "People differ in height."}, {"en": "continuous", "ar": "متصل", "pr": "kun-TIN-yoo-us", "ex": "Height is continuous."}, {"en": "discontinuous", "ar": "منفصل", "pr": "dis-kun-TIN-yoo-us", "ex": "Blood group is discontinuous."}, {"en": "inherited", "ar": "موروث", "pr": "in-HER-i-tid", "ex": "Eye colour is inherited."}]}, {"id": "6.4", "title": "How Do We Classify Plants?", "paras": ["Plants are divided into flowering and non-flowering groups. Flowering plants (angiosperms) produce flowers, fruits and seeds, such as roses and maize. They can be monocots (one seed leaf, parallel leaf veins, like grass) or dicots (two seed leaves, branching veins).", "Non-flowering plants: conifers make seeds in cones (pine); ferns have fronds and reproduce by spores; mosses are small with no true roots and also use spores."], "key": ["flowering plant", "conifer", "fern", "moss", "spores", "monocot", "dicot"], "qs": [{"q": "How do ferns reproduce?", "o": ["Seeds in cones, needle-like leaves.", "Monocots and dicots.", "Mosses.", "By spores."], "a": 3}, {"q": "Name one conifer feature.", "o": ["Monocots and dicots.", "Mosses.", "By spores.", "Seeds in cones, needle-like leaves."], "a": 3}, {"q": "What are the two groups of flowering plants?", "o": ["Monocots and dicots.", "Mosses.", "Seeds in cones, needle-like leaves.", "By spores."], "a": 0}, {"q": "Which plant group has no true roots?", "o": ["Mosses.", "By spores.", "Seeds in cones, needle-like leaves.", "Monocots and dicots."], "a": 0}], "cards": [{"en": "flowering plant", "ar": "نبات مزهر", "pr": "FLOW-er-ing plant", "ex": "A rose."}, {"en": "conifer", "ar": "مخروطيات", "pr": "KON-i-fer", "ex": "A pine tree has cones."}, {"en": "fern", "ar": "سرخس", "pr": "furn", "ex": "Reproduces by spores."}, {"en": "moss", "ar": "طحلب", "pr": "mos", "ex": "Small plant with no true roots."}, {"en": "spores", "ar": "أبواغ", "pr": "sporz", "ex": "Ferns release spores."}, {"en": "monocot", "ar": "أحادية الفلقة", "pr": "MON-oh-kot", "ex": "Grass has one seed leaf."}, {"en": "dicot", "ar": "ثنائية الفلقة", "pr": "DY-kot", "ex": "A bean has two seed leaves."}]}, {"id": "6.5", "title": "How Do We Classify Animals?", "paras": ["Animals are split into vertebrates (with a backbone) and invertebrates (without). The five vertebrate groups are:", "Mammals: hair or fur, give birth to live young and feed them milk, warm-blooded. Birds: feathers, wings, lay hard-shelled eggs, warm-blooded. Reptiles: dry scaly skin, lay eggs on land, cold-blooded. Amphibians: moist skin, lay eggs in water, live on land and in water, cold-blooded. Fish: scales, gills, fins, live in water, cold-blooded.", "Invertebrates include arthropods (insects, spiders, crustaceans, with jointed legs), molluscs (snails), annelids (worms) and others."], "key": ["vertebrate", "invertebrate", "mammal", "bird", "reptile", "amphibian", "fish", "arthropod"], "qs": [{"q": "What is the difference between vertebrates and invertebrates?", "o": ["Hair or fur; feed young with milk; live birth.", "Fish.", "Birds.", "Vertebrates have a backbone; invertebrates do not."], "a": 3}, {"q": "Which group has feathers?", "o": ["Vertebrates have a backbone; invertebrates do not.", "Fish.", "Birds.", "Hair or fur; feed young with milk; live birth."], "a": 2}, {"q": "Which vertebrate group breathes with gills?", "o": ["Vertebrates have a backbone; invertebrates do not.", "Birds.", "Fish.", "Hair or fur; feed young with milk; live birth."], "a": 2}, {"q": "Name two features of mammals.", "o": ["Hair or fur; feed young with milk; live birth.", "Birds.", "Fish.", "Vertebrates have a backbone; invertebrates do not."], "a": 0}], "cards": [{"en": "vertebrate", "ar": "فقاري", "pr": "VER-tuh-brit", "ex": "Has a backbone, like a fish."}, {"en": "invertebrate", "ar": "لافقاري", "pr": "in-VER-tuh-brit", "ex": "A snail has no backbone."}, {"en": "mammal", "ar": "ثديي", "pr": "MAM-ul", "ex": "A cat feeds milk to its young."}, {"en": "bird", "ar": "طائر", "pr": "burd", "ex": "Has feathers and lays eggs."}, {"en": "reptile", "ar": "زاحف", "pr": "REP-tyl", "ex": "A lizard has dry scaly skin."}, {"en": "amphibian", "ar": "برمائي", "pr": "am-FIB-ee-un", "ex": "A frog lives on land and in water."}, {"en": "fish", "ar": "سمكة", "pr": "fish", "ex": "Has gills and fins."}, {"en": "arthropod", "ar": "مفصليات", "pr": "AR-thruh-pod", "ex": "Insects have jointed legs."}]}]}, {"n": 7, "title": "States of Matter and the Particle Theory", "lessons": [{"id": "7.1", "title": "The Particle Theory", "paras": ["Everything is made of tiny particles. The three states of matter are solid, liquid and gas. In a solid the particles are packed closely in a regular pattern and only vibrate; a solid has a fixed shape and volume. In a liquid the particles are close but can slide past each other; a liquid has a fixed volume but takes the shape of its container. In a gas the particles are far apart and move quickly in all directions; a gas has no fixed shape or volume and can be compressed.", "Diffusion is the spreading of particles from where there are many to where there are fewer, such as perfume spreading across a room. It is fastest in gases and when warmer."], "key": ["particle", "solid", "liquid", "gas", "diffusion", "compress"], "qs": [{"q": "Which state has particles that only vibrate in fixed places?", "o": ["Solid.", "The spreading of particles from high to low concentration.", "Its particles are far apart, so there is space between them.", "Liquid."], "a": 0}, {"q": "Why can a gas be squashed?", "o": ["Solid.", "Liquid.", "Its particles are far apart, so there is space between them.", "The spreading of particles from high to low concentration."], "a": 2}, {"q": "What is diffusion?", "o": ["Its particles are far apart, so there is space between them.", "Solid.", "The spreading of particles from high to low concentration.", "Liquid."], "a": 2}, {"q": "Which state has fixed volume but no fixed shape?", "o": ["Its particles are far apart, so there is space between them.", "The spreading of particles from high to low concentration.", "Solid.", "Liquid."], "a": 3}], "cards": [{"en": "particle", "ar": "جسيم", "pr": "PAR-ti-kul", "ex": "Everything is made of tiny particles."}, {"en": "solid", "ar": "صلب", "pr": "SOL-id", "ex": "Ice is a solid."}, {"en": "liquid", "ar": "سائل", "pr": "LIK-wid", "ex": "Water is a liquid."}, {"en": "gas", "ar": "غاز", "pr": "gas", "ex": "Steam is a gas."}, {"en": "diffusion", "ar": "الانتشار", "pr": "di-FYOO-zhun", "ex": "Perfume spreads across a room."}, {"en": "compress", "ar": "يضغط", "pr": "kum-PRES", "ex": "Gas can be squashed."}]}, {"id": "7.2", "title": "The Particle Theory and Changes of State", "paras": ["Changes of state happen when energy is added or removed. Melting: solid to liquid. Freezing: liquid to solid. Boiling or evaporation: liquid to gas. Condensation: gas to liquid. Sublimation: solid straight to gas (dry ice, iodine).", "Heating gives particles more energy so they move faster and overcome the forces holding them together. Melting point of ice is 0 degrees C and boiling point of water is 100 degrees C. During a change of state the temperature stays constant. Evaporation happens only at the surface and at any temperature, but boiling happens throughout the liquid at the boiling point."], "key": ["melting", "freezing", "boiling", "evaporation", "condensation", "sublimation"], "qs": [{"q": "What is the change from gas to liquid called?", "o": ["Particles gain energy and move enough to break out of their fixed positions.", "0 degrees C.", "Boiling happens throughout the liquid at the boiling point; evaporation happens only at the surface at any temperature.", "Condensation."], "a": 3}, {"q": "What is the melting point of ice?", "o": ["Boiling happens throughout the liquid at the boiling point; evaporation happens only at the surface at any temperature.", "Condensation.", "Particles gain energy and move enough to break out of their fixed positions.", "0 degrees C."], "a": 3}, {"q": "Why does heating a solid make it melt?", "o": ["Particles gain energy and move enough to break out of their fixed positions.", "0 degrees C.", "Condensation.", "Boiling happens throughout the liquid at the boiling point; evaporation happens only at the surface at any temperature."], "a": 0}, {"q": "Name one difference between boiling and evaporation.", "o": ["Particles gain energy and move enough to break out of their fixed positions.", "Condensation.", "0 degrees C.", "Boiling happens throughout the liquid at the boiling point; evaporation happens only at the surface at any temperature."], "a": 3}], "cards": [{"en": "melting", "ar": "الانصهار", "pr": "MEL-ting", "ex": "Ice melts at 0 degrees C."}, {"en": "freezing", "ar": "التجمد", "pr": "FREE-zing", "ex": "Water turns to ice."}, {"en": "boiling", "ar": "الغليان", "pr": "BOY-ling", "ex": "Water boils at 100 degrees C."}, {"en": "evaporation", "ar": "التبخر", "pr": "i-vap-uh-RAY-shun", "ex": "Puddles dry up."}, {"en": "condensation", "ar": "التكثف", "pr": "kon-den-SAY-shun", "ex": "Drops on a cold glass."}, {"en": "sublimation", "ar": "التسامي", "pr": "sub-li-MAY-shun", "ex": "Dry ice turns straight to gas."}]}]}, {"n": 8, "title": "Materials and Their Properties", "lessons": [{"id": "8.1", "title": "Physical Properties", "paras": ["A physical property describes how a material looks or behaves without changing it into something new. Examples: hardness, strength, density, melting and boiling point, electrical conductivity, thermal conductivity, magnetism, solubility, malleability (can be hammered into shape) and ductility (can be drawn into wires), and appearance such as lustre (shiny).", "Density is how much mass is in a given volume. Density = mass / volume. A dense material like iron feels heavy for its size."], "key": ["hardness", "density", "conductor", "insulator", "malleable", "ductile"], "qs": [{"q": "What is density?", "o": ["Can be drawn into wires.", "Mass per unit volume (mass / volume).", "A material that does not let heat or electricity pass easily.", "200 / 50 = 4 g/cm3."], "a": 1}, {"q": "What does ductile mean?", "o": ["Can be drawn into wires.", "A material that does not let heat or electricity pass easily.", "Mass per unit volume (mass / volume).", "200 / 50 = 4 g/cm3."], "a": 0}, {"q": "A block has mass 200 g and volume 50 cm3. What is its density?", "o": ["200 / 50 = 4 g/cm3.", "Mass per unit volume (mass / volume).", "Can be drawn into wires.", "A material that does not let heat or electricity pass easily."], "a": 0}, {"q": "What is an insulator?", "o": ["Can be drawn into wires.", "A material that does not let heat or electricity pass easily.", "Mass per unit volume (mass / volume).", "200 / 50 = 4 g/cm3."], "a": 1}], "cards": [{"en": "hardness", "ar": "الصلابة", "pr": "HARD-nis", "ex": "Diamond is very hard."}, {"en": "density", "ar": "الكثافة", "pr": "DEN-si-tee", "ex": "Mass divided by volume."}, {"en": "conductor", "ar": "موصل", "pr": "kun-DUK-ter", "ex": "Copper conducts electricity."}, {"en": "insulator", "ar": "عازل", "pr": "IN-syoo-lay-ter", "ex": "Plastic does not conduct."}, {"en": "malleable", "ar": "قابل للطرق", "pr": "MAL-ee-uh-bul", "ex": "Gold can be hammered flat."}, {"en": "ductile", "ar": "قابل للسحب", "pr": "DUK-tyl", "ex": "Copper is drawn into wires."}]}, {"id": "8.2", "title": "Metals and Non-metals", "paras": ["Metals are usually shiny, hard, strong, malleable, ductile, good conductors of heat and electricity, have high melting points and are dense, and make a ringing sound when hit (sonorous). Most are solid at room temperature (mercury is liquid), and iron, cobalt and nickel are magnetic.", "Non-metals are usually dull, brittle when solid, poor conductors (graphite is an exception) and have low melting points. Many are gases (oxygen) or solids like sulfur and carbon."], "key": ["metal", "non-metal", "conductor", "brittle", "sonorous"], "qs": [{"q": "Name three properties of metals.", "o": ["Shiny, malleable, ductile, good conductors, strong, high melting point.", "Graphite (carbon).", "Breaks or shatters easily instead of bending.", "Mercury."], "a": 0}, {"q": "Which non-metal conducts electricity?", "o": ["Mercury.", "Shiny, malleable, ductile, good conductors, strong, high melting point.", "Breaks or shatters easily instead of bending.", "Graphite (carbon)."], "a": 3}, {"q": "What does brittle mean?", "o": ["Shiny, malleable, ductile, good conductors, strong, high melting point.", "Breaks or shatters easily instead of bending.", "Mercury.", "Graphite (carbon)."], "a": 1}, {"q": "Which metal is liquid at room temperature?", "o": ["Mercury.", "Breaks or shatters easily instead of bending.", "Shiny, malleable, ductile, good conductors, strong, high melting point.", "Graphite (carbon)."], "a": 0}], "cards": [{"en": "metal", "ar": "فلز", "pr": "MET-ul", "ex": "Iron is a metal."}, {"en": "non-metal", "ar": "لافلز", "pr": "non-MET-ul", "ex": "Sulfur is a non-metal."}, {"en": "conductor", "ar": "موصل", "pr": "kun-DUK-ter", "ex": "Copper conducts electricity."}, {"en": "brittle", "ar": "هش", "pr": "BRIT-ul", "ex": "Glass breaks easily."}, {"en": "
