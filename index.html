sonorous", "ar": "رنّان", "pr": "SON-er-us", "ex": "Metals ring when hit."}]}, {"id": "8.3", "title": "Everyday Materials and Their Properties", "paras": ["We choose materials by their properties. Copper is used for electrical wires because it is a good conductor and ductile. Plastic covers wires because it is an insulator. Aluminium is used for aircraft because it is light and strong. Glass is transparent and hard so it is used for windows. Ceramics are heat-resistant, so they are used for cups and tiles. Rubber is flexible and waterproof so it is used for tyres. Wood is a cheap, renewable building material.", "Materials can be natural (wood, wool, cotton) or man-made (plastic, nylon, glass). Many plastics do not rot, which causes waste problems."], "key": ["properties", "natural", "man-made", "ceramic", "plastic"], "qs": [{"q": "Why are electrical wires made of copper?", "o": ["It is an electrical insulator.", "Natural: wood or cotton. Man-made: plastic or nylon.", "It is a good conductor and can be drawn into wires.", "It is light but strong."], "a": 2}, {"q": "Why is plastic used on the outside of wires?", "o": ["Natural: wood or cotton. Man-made: plastic or nylon.", "It is light but strong.", "It is an electrical insulator.", "It is a good conductor and can be drawn into wires."], "a": 2}, {"q": "Give one natural and one man-made material.", "o": ["It is an electrical insulator.", "Natural: wood or cotton. Man-made: plastic or nylon.", "It is light but strong.", "It is a good conductor and can be drawn into wires."], "a": 1}, {"q": "Why is aluminium used in aircraft?", "o": ["It is light but strong.", "Natural: wood or cotton. Man-made: plastic or nylon.", "It is a good conductor and can be drawn into wires.", "It is an electrical insulator."], "a": 0}], "cards": [{"en": "properties", "ar": "خصائص", "pr": "PROP-er-teez", "ex": "Hardness and colour are properties."}, {"en": "natural", "ar": "طبيعي", "pr": "NACH-er-ul", "ex": "Wood is natural."}, {"en": "man-made", "ar": "صناعي", "pr": "man-MAYD", "ex": "Plastic is man-made."}, {"en": "ceramic", "ar": "سيراميك", "pr": "suh-RAM-ik", "ex": "A cup or tile."}, {"en": "plastic", "ar": "بلاستيك", "pr": "PLAS-tik", "ex": "Waterproof and light."}]}]}, {"n": 9, "title": "Acids and Alkalis", "lessons": [{"id": "9.1", "title": "What Are Acids?", "paras": ["Acids are substances that taste sour and turn blue litmus paper red. Examples: lemon juice (citric acid), vinegar (ethanoic acid), and in the lab hydrochloric, sulfuric and nitric acid. Strong acids are corrosive and must be handled with care. Acids react with some metals to make hydrogen gas and with carbonates to make carbon dioxide.", "Never taste chemicals in the lab. Acids are used in food, batteries, cleaning and making fertilisers."], "key": ["acid", "sour", "corrosive", "litmus"], "qs": [{"q": "What colour does an acid turn blue litmus paper?", "o": ["Hydrochloric, sulfuric or nitric acid.", "Red.", "Citric acid.", "They can be corrosive or toxic."], "a": 1}, {"q": "Name an acid found in lemons.", "o": ["Hydrochloric, sulfuric or nitric acid.", "Citric acid.", "They can be corrosive or toxic.", "Red."], "a": 1}, {"q": "Name one acid used in the lab.", "o": ["Red.", "They can be corrosive or toxic.", "Citric acid.", "Hydrochloric, sulfuric or nitric acid."], "a": 3}, {"q": "Why should you not taste lab chemicals?", "o": ["Red.", "Citric acid.", "They can be corrosive or toxic.", "Hydrochloric, sulfuric or nitric acid."], "a": 2}], "cards": [{"en": "acid", "ar": "حمض", "pr": "AS-id", "ex": "Lemon juice is an acid."}, {"en": "sour", "ar": "حامض الطعم", "pr": "SOW-er", "ex": "Lemons taste sour."}, {"en": "corrosive", "ar": "مادة أكّالة", "pr": "kuh-ROH-siv", "ex": "Strong acids are corrosive."}, {"en": "litmus", "ar": "عباد الشمس", "pr": "LIT-mus", "ex": "Turns red in acid."}]}, {"id": "9.2", "title": "What Are Alkalis?", "paras": ["Alkalis are soluble bases. They feel soapy, taste bitter, and turn red litmus paper blue. Examples: sodium hydroxide (caustic soda), potassium hydroxide, calcium hydroxide (limewater) and ammonia. Bases are substances that react with acids; those that dissolve in water are alkalis. Alkalis are used in soaps, cleaning products, and some medicines. Strong alkalis are also corrosive."], "key": ["alkali", "base", "soapy", "sodium hydroxide"], "qs": [{"q": "What does an alkali do to red litmus?", "o": ["Turns it blue.", "Sodium hydroxide.", "A base that dissolves in water.", "Soap, cleaning products, making paper."], "a": 0}, {"q": "What is an alkali?", "o": ["Turns it blue.", "A base that dissolves in water.", "Soap, cleaning products, making paper.", "Sodium hydroxide."], "a": 1}, {"q": "Name one use of alkalis.", "o": ["A base that dissolves in water.", "Turns it blue.", "Sodium hydroxide.", "Soap, cleaning products, making paper."], "a": 3}, {"q": "Name a common alkali.", "o": ["A base that dissolves in water.", "Soap, cleaning products, making paper.", "Turns it blue.", "Sodium hydroxide."], "a": 3}], "cards": [{"en": "alkali", "ar": "قلوي", "pr": "AL-kuh-ly", "ex": "Sodium hydroxide."}, {"en": "base", "ar": "قاعدة", "pr": "bayss", "ex": "Reacts with acid."}, {"en": "soapy", "ar": "صابوني الملمس", "pr": "SOH-pee", "ex": "Alkalis feel soapy."}, {"en": "sodium hydroxide", "ar": "هيدروكسيد الصوديوم", "pr": "SOH-dee-um hy-DROK-syd", "ex": "A strong alkali."}]}, {"id": "9.3", "title": "What Are Indicators?", "paras": ["An indicator is a substance that changes colour depending on whether it is in an acid or an alkali. Litmus is red in acid, blue in alkali, and purple in neutral solutions. Universal indicator shows a range of colours: red or orange for strong acids, yellow for weak acids, green for neutral, blue for weak alkalis and purple for strong alkalis. Natural indicators include red cabbage juice and beetroot. Methyl orange and phenolphthalein are other lab indicators."], "key": ["indicator", "litmus", "universal indicator", "neutral"], "qs": [{"q": "What colour is universal indicator in a neutral solution?", "o": ["A substance that changes colour in acids and alkalis.", "Red cabbage juice.", "Green.", "Purple."], "a": 2}, {"q": "What is an indicator?", "o": ["Red cabbage juice.", "Purple.", "A substance that changes colour in acids and alkalis.", "Green."], "a": 2}, {"q": "Name a natural indicator.", "o": ["Green.", "Red cabbage juice.", "A substance that changes colour in acids and alkalis.", "Purple."], "a": 1}, {"q": "What colour is litmus in a neutral solution?", "o": ["Purple.", "Green.", "A substance that changes colour in acids and alkalis.", "Red cabbage juice."], "a": 0}], "cards": [{"en": "indicator", "ar": "كاشف", "pr": "IN-di-kay-ter", "ex": "Litmus is an indicator."}, {"en": "litmus", "ar": "عباد الشمس", "pr": "LIT-mus", "ex": "Turns red in acid."}, {"en": "universal indicator", "ar": "الكاشف العام", "pr": "yoo-ni-VUR-sul IN-di-kay-ter", "ex": "Green when neutral."}, {"en": "neutral", "ar": "متعادل", "pr": "NYOO-trul", "ex": "Pure water, pH 7."}]}, {"id": "9.4", "title": "What Is the pH Scale?", "paras": ["The pH scale measures how acidic or alkaline a solution is, from 0 to 14. Below 7 is acid (lower means stronger), 7 is neutral (pure water), above 7 is alkali (higher means stronger). Examples: stomach acid pH 1, lemon juice pH 2, pure water pH 7, baking soda solution pH 9, bleach pH 12. We measure pH with universal indicator or a pH meter."], "key": ["pH scale", "acidic", "neutral", "alkaline"], "qs": [{"q": "What pH is neutral?", "o": ["7.", "Alkali.", "With universal indicator paper or solution, or a pH meter.", "pH 2."], "a": 0}, {"q": "Which is more acidic: pH 2 or pH 5?", "o": ["pH 2.", "With universal indicator paper or solution, or a pH meter.", "Alkali.", "7."], "a": 0}, {"q": "A solution has pH 10. Is it acid or alkali?", "o": ["Alkali.", "7.", "With universal indicator paper or solution, or a pH meter.", "pH 2."], "a": 0}, {"q": "How can you measure pH?", "o": ["7.", "Alkali.", "pH 2.", "With universal indicator paper or solution, or a pH meter."], "a": 3}], "cards": [{"en": "pH scale", "ar": "مقياس الأس الهيدروجيني", "pr": "pee-AYCH skayl", "ex": "From 0 to 14."}, {"en": "acidic", "ar": "حمضي", "pr": "uh-SID-ik", "ex": "pH below 7."}, {"en": "neutral", "ar": "متعادل", "pr": "NYOO-trul", "ex": "Pure water, pH 7."}, {"en": "alkaline", "ar": "قلوي (قاعدي)", "pr": "AL-kuh-lyn", "ex": "pH above 7."}]}, {"id": "9.5", "title": "Neutralisation", "paras": ["Neutralisation is the reaction between an acid and an alkali (or a base) that makes a neutral solution of pH 7. The general word equation: acid + alkali = salt + water. For example hydrochloric acid + sodium hydroxide = sodium chloride + water.", "Uses: antacid tablets neutralise excess stomach acid, toothpaste neutralises acid in the mouth, farmers add lime to acidic soil, and a bee sting (acid) can be treated with an alkali like baking soda."], "key": ["neutralisation", "salt", "antacid", "base"], "qs": [{"q": "What two products are made in neutralisation?", "o": ["They neutralise too much stomach acid.", "Sodium chloride + water.", "To neutralise acid soil.", "A salt and water."], "a": 3}, {"q": "Why do people take antacid tablets?", "o": ["They neutralise too much stomach acid.", "A salt and water.", "Sodium chloride + water.", "To neutralise acid soil."], "a": 0}, {"q": "Why do farmers add lime to soil?", "o": ["They neutralise too much stomach acid.", "A salt and water.", "To neutralise acid soil.", "Sodium chloride + water."], "a": 2}, {"q": "Complete: hydrochloric acid + sodium hydroxide = ?", "o": ["To neutralise acid soil.", "Sodium chloride + water.", "They neutralise too much stomach acid.", "A salt and water."], "a": 1}], "cards": [{"en": "neutralisation", "ar": "التعادل", "pr": "nyoo-truh-ly-ZAY-shun", "ex": "Acid plus alkali gives salt and water."}, {"en": "salt", "ar": "ملح", "pr": "sawlt", "ex": "Sodium chloride."}, {"en": "antacid", "ar": "مضاد للحموضة", "pr": "ant-AS-id", "ex": "Eases stomach acid."}, {"en": "base", "ar": "قاعدة", "pr": "bayss", "ex": "Reacts with acid."}]}]}, {"n": 10, "title": "The Earth and Its Structure", "lessons": [{"id": "10.1", "title": "Rocks", "paras": ["Rocks are made of one or more minerals. There are three types: igneous, sedimentary and metamorphic. They are linked in the rock cycle, where rocks are slowly changed from one type to another over millions of years by weathering, erosion, heat, pressure and melting. Rocks are used for building, roads and as sources of metals."], "key": ["rock", "mineral", "rock cycle"], "qs": [{"q": "Name the three types of rock.", "o": ["Building material, roads, extracting metals.", "Minerals.", "Igneous, sedimentary, metamorphic.", "Sandstone, limestone, shale, chalk."], "a": 2}, {"q": "What are rocks made of?", "o": ["Building material, roads, extracting metals.", "Minerals.", "Igneous, sedimentary, metamorphic.", "Loam."], "a": 1}, {"q": "Give a use of rock.", "o": ["Building material, roads, extracting metals.", "Minerals.", "Igneous, sedimentary, metamorphic.", "Decayed plant and animal matter in soil."], "a": 0}], "cards": [{"en": "rock", "ar": "صخر", "pr": "rok", "ex": "Granite is a rock."}, {"en": "mineral", "ar": "معدن طبيعي", "pr": "MIN-er-ul", "ex": "Rocks are made of minerals."}, {"en": "rock cycle", "ar": "دورة الصخور", "pr": "rok SY-kul", "ex": "Rocks change type over time."}]}, {"id": "10.2", "title": "Sedimentary Rocks", "paras": ["Sedimentary rocks form when sediments (bits of rock, sand, mud and shells) are laid down in layers, usually in water. Layers on the bottom are squashed (compaction) and the pieces are stuck together by dissolved minerals (cementation). This takes millions of years.", "They are usually softer, may have layers and can contain fossils. Examples: sandstone, limestone, shale, chalk, conglomerate."], "key": ["sediment", "compaction", "cementation", "limestone", "sandstone"], "qs": [{"q": "How do sedimentary rocks form?", "o": ["Sandstone, limestone, shale, chalk.", "Sedimentary rock.", "Dissolved minerals stick the sediment pieces together.", "Sediments settle in layers, are compacted and cemented."], "a": 3}, {"q": "Which type of rock often contains fossils?", "o": ["Sandstone, limestone, shale, chalk.", "Sedimentary rock.", "Sediments settle in layers, are compacted and cemented.", "Dissolved minerals stick the sediment pieces together."], "a": 1}, {"q": "Name two sedimentary rocks.", "o": ["Sediments settle in layers, are compacted and cemented.", "Dissolved minerals stick the sediment pieces together.", "Sandstone, limestone, shale, chalk.", "Sedimentary rock."], "a": 2}, {"q": "What does cementation mean?", "o": ["Sedimentary rock.", "Dissolved minerals stick the sediment pieces together.", "Sandstone, limestone, shale, chalk.", "Sediments settle in layers, are compacted and cemented."], "a": 1}], "cards": [{"en": "sediment", "ar": "رواسب", "pr": "SED-i-ment", "ex": "Sand and mud."}, {"en": "compaction", "ar": "الانضغاط", "pr": "kum-PAK-shun", "ex": "Layers are pressed together."}, {"en": "cementation", "ar": "التلاحم", "pr": "see-men-TAY-shun", "ex": "Minerals glue pieces."}, {"en": "limestone", "ar": "حجر جيري", "pr": "LYM-stohn", "ex": "A sedimentary rock."}, {"en": "sandstone", "ar": "حجر رملي", "pr": "SAND-stohn", "ex": "Made of sand grains."}]}, {"id": "10.3", "title": "Igneous Rocks", "paras": ["Igneous rocks form when hot molten rock cools and solidifies. Underground, molten rock is called magma; at the surface it is called lava. If magma cools slowly underground, large crystals form (granite). If lava cools quickly on the surface, tiny crystals form (basalt). Igneous rocks are hard, have no layers and have no fossils."], "key": ["igneous", "magma", "lava", "crystals", "granite", "basalt"], "qs": [{"q": "What is the difference between magma and lava?", "o": ["Magma is underground; lava is at the surface.", "Basalt.", "No.", "It cools slowly underground."], "a": 0}, {"q": "Why does granite have large crystals?", "o": ["Magma is underground; lava is at the surface.", "Basalt.", "It cools slowly underground.", "No."], "a": 2}, {"q": "Name an igneous rock formed from fast cooling lava.", "o": ["It cools slowly underground.", "No.", "Magma is underground; lava is at the surface.", "Basalt."], "a": 3}, {"q": "Do igneous rocks contain fossils?", "o": ["No.", "It cools slowly underground.", "Basalt.", "Magma is underground; lava is at the surface."], "a": 0}], "cards": [{"en": "igneous", "ar": "ناري", "pr": "IG-nee-us", "ex": "Formed from cooled magma."}, {"en": "magma", "ar": "صهارة", "pr": "MAG-muh", "ex": "Molten rock underground."}, {"en": "lava", "ar": "حمم", "pr": "LAH-vuh", "ex": "Molten rock on the surface."}, {"en": "crystals", "ar": "بلورات", "pr": "KRIS-tulz", "ex": "Large in granite."}, {"en": "granite", "ar": "جرانيت", "pr": "GRAN-it", "ex": "Slowly cooled igneous rock."}, {"en": "basalt", "ar": "بازلت", "pr": "BAS-awlt", "ex": "Fast-cooled lava."}]}, {"id": "10.4", "title": "Metamorphic Rocks", "paras": ["Metamorphic rocks form when existing rocks are changed by great heat and pressure, but without melting. This happens deep inside the Earth. The minerals recrystallise and the rock becomes harder. Examples: marble (from limestone), slate (from shale), quartzite (from sandstone) and gneiss (from granite). Metamorphic rocks often have bands or layers of crystals."], "key": ["metamorphic", "heat", "pressure", "marble", "slate"], "qs": [{"q": "What changes rocks into metamorphic rocks?", "o": ["Slate, quartzite or gneiss.", "Marble.", "No.", "Heat and pressure."], "a": 3}, {"q": "Which rock does limestone become?", "o": ["Slate, quartzite or gneiss.", "Marble.", "Heat and pressure.", "No."], "a": 1}, {"q": "Do the rocks melt when they become metamorphic?", "o": ["No.", "Marble.", "Heat and pressure.", "Slate, quartzite or gneiss."], "a": 0}, {"q": "Name another metamorphic rock.", "o": ["No.", "Slate, quartzite or gneiss.", "Marble.", "Heat and pressure."], "a": 1}], "cards": [{"en": "metamorphic", "ar": "متحول", "pr": "met-uh-MOR-fik", "ex": "Changed by heat and pressure."}, {"en": "heat", "ar": "حرارة", "pr": "heet", "ex": "Heat changes rocks."}, {"en": "pressure", "ar": "ضغط", "pr": "PRESH-er", "ex": "Deep underground pressure."}, {"en": "marble", "ar": "رخام", "pr": "MAR-bul", "ex": "Made from limestone."}, {"en": "slate", "ar": "أردواز", "pr": "slayt", "ex": "Made from shale."}]}, {"id": "10.5", "title": "Weathering", "paras": ["Weathering is the breaking down of rocks into smaller pieces by weather and living things, without moving them. Physical weathering: temperature changes cause rocks to expand and contract and crack; freeze-thaw, where water in cracks freezes, expands and splits the rock. Chemical weathering: acid rain slowly dissolves rocks such as limestone. Biological weathering: plant roots grow into cracks and widen them.", "Erosion is when the pieces are carried away by wind, water or ice."], "key": ["weathering", "erosion", "freeze-thaw", "acid rain"], "qs": [{"q": "What is weathering?", "o": ["Roots grow into cracks and widen them.", "Weathering breaks rock down; erosion carries the pieces away.", "Water enters cracks, freezes and expands, splitting the rock.", "Breaking down of rock into smaller pieces where it is."], "a": 3}, {"q": "Explain freeze-thaw weathering.", "o": ["Roots grow into cracks and widen them.", "Weathering breaks rock down; erosion carries the pieces away.", "Breaking down of rock into smaller pieces where it is.", "Water enters cracks, freezes and expands, splitting the rock."], "a": 3}, {"q": "How can plants weather rocks?", "o": ["Water enters cracks, freezes and expands, splitting the rock.", "Roots grow into cracks and widen them.", "Breaking down of rock into smaller pieces where it is.", "Weathering breaks rock down; erosion carries the pieces away."], "a": 1}, {"q": "What is the difference between weathering and erosion?", "o": ["Breaking down of rock into smaller pieces where it is.", "Roots grow into cracks and widen them.", "Weathering breaks rock down; erosion carries the pieces away.", "Water enters cracks, freezes and expands, splitting the rock."], "a": 2}], "cards": [{"en": "weathering", "ar": "التجوية", "pr": "WETH-er-ing", "ex": "Rocks crack in cold."}, {"en": "erosion", "ar": "التعرية", "pr": "i-ROH-zhun", "ex": "Rivers carry pieces away."}, {"en": "freeze-thaw", "ar": "التجمد والذوبان", "pr": "freez-thaw", "ex": "Ice splits rocks."}, {"en": "acid rain", "ar": "المطر الحمضي", "pr": "AS-id rayn", "ex": "Damages stone buildings."}]}, {"id": "10.6", "title": "Soil", "paras": ["Soil forms from weathered rock mixed with humus (decayed plants and animals), water, air and living things. Soil has layers: topsoil (dark, rich in humus), subsoil and then bedrock. There are different soil types: sandy soil has large particles, drains quickly and is poor at holding water; clay has tiny particles, holds water and drains slowly; loam is a mixture, good for growing plants.", "Soil provides water, minerals and support for plants and is a habitat for many organisms such as earthworms."], "key": ["soil", "humus", "topsoil", "sandy", "clay", "loam"], "qs": [{"q": "What is humus?", "o": ["Sandy soil.", "Loam.", "Decayed plant and animal matter in soil.", "Topsoil."], "a": 2}, {"q": "Which soil type drains the fastest?", "o": ["Sandy soil.", "Loam.", "Decayed plant and animal matter in soil.", "Topsoil."], "a": 0}, {"q": "Which soil is best for growing crops?", "o": ["Sandy soil.", "Decayed plant and animal matter in soil.", "Topsoil.", "Loam."], "a": 3}, {"q": "Name the top layer of soil.", "o": ["Topsoil.", "Decayed plant and animal matter in soil.", "Sandy soil.", "Loam."], "a": 0}], "cards": [{"en": "soil", "ar": "التربة", "pr": "soyl", "ex": "Plants grow in soil."}, {"en": "humus", "ar": "الدبال", "pr": "HYOO-mus", "ex": "Rotted plants in soil."}, {"en": "topsoil", "ar": "التربة السطحية", "pr": "TOP-soyl", "ex": "Dark, rich top layer."}, {"en": "sandy", "ar": "رملي", "pr": "SAN-dee", "ex": "Drains quickly."}, {"en": "clay", "ar": "طين", "pr": "klay", "ex": "Holds water."}, {"en": "loam", "ar": "تربة طفلية", "pr": "lohm", "ex": "Best for crops."}]}, {"id": "10.7", "title": "Fossils", "paras": ["Fossils are the remains or traces of living things that died long ago and were preserved in rock. Most form when an organism is buried quickly in sediment; the hard parts such as bones and shells slowly turn to stone over millions of years. Fossils are found in sedimentary rocks. Fossils tell us what organisms lived in the past, how life has changed, the age of rocks, and what the environment was like. Fossil fuels like coal and oil also formed from ancient organisms."], "key": ["fossil", "preserved", "sediment", "extinct"], "qs": [{"q": "What is a fossil?", "o": ["They do not rot as fast and can be replaced by minerals.", "The preserved remains or traces of an organism from long ago.", "What life was like in the past or the age of rocks.", "Sedimentary."], "a": 1}, {"q": "In which rock type are fossils usually found?", "o": ["Sedimentary.", "They do not rot as fast and can be replaced by minerals.", "The preserved remains or traces of an organism from long ago.", "What life was like in the past or the age of rocks."], "a": 0}, {"q": "Why do hard parts like bones fossilise more easily?", "o": ["Sedimentary.", "What life was like in the past or the age of rocks.", "The preserved remains or traces of an organism from long ago.", "They do not rot as fast and can be replaced by minerals."], "a": 3}, {"q": "Give one thing fossils tell us.", "o": ["The preserved remains or traces of an organism from long ago.", "They do not rot as fast and can be replaced by minerals.", "Sedimentary.", "What life was like in the past or the age of rocks."], "a": 3}], "cards": [{"en": "fossil", "ar": "أحفورة", "pr": "FOS-ul", "ex": "A shell in rock."}, {"en": "preserved", "ar": "محفوظ", "pr": "pri-ZURVD", "ex": "Bones kept in rock."}, {"en": "sediment", "ar": "رواسب", "pr": "SED-i-ment", "ex": "Sand and mud."}, {"en": "extinct", "ar": "منقرض", "pr": "ik-STINKT", "ex": "Dinosaurs are extinct."}]}, {"id": "10.8", "title": "The Structure and Age of the Earth", "paras": ["The Earth has four main layers. The crust is the thin, solid outer layer. The mantle is a thick layer of hot, partly molten rock below it. The outer core is liquid iron and nickel. The inner core is solid iron and nickel, and the hottest part. The crust is broken into large tectonic plates that move slowly. Where plates meet, earthquakes and volcanoes occur.", "Scientists estimate the Earth is about 4.5 billion years old, using radioactive dating of rocks."], "key": ["crust", "mantle", "core", "tectonic plates", "earthquake"], "qs": [{"q": "Name the four layers of the Earth.", "o": ["About 4.5 billion years.", "Crust, mantle, outer core, inner core.", "The outer core.", "Movement of tectonic plates."], "a": 1}, {"q": "Which layer is liquid metal?", "o": ["About 4.5 billion years.", "Crust, mantle, outer core, inner core.", "The outer core.", "Movement of tectonic plates."], "a": 2}, {"q": "What causes earthquakes and volcanoes?", "o": ["The outer core.", "Movement of tectonic plates.", "About 4.5 billion years.", "Crust, mantle, outer core, inner core."], "a": 1}, {"q": "How old is the Earth?", "o": ["About 4.5 billion years.", "The outer core.", "Crust, mantle, outer core, inner core.", "Movement of tectonic plates."], "a": 0}], "cards": [{"en": "crust", "ar": "القشرة الأرضية", "pr": "krust", "ex": "Thin outer layer."}, {"en": "mantle", "ar": "الستار", "pr": "MAN-tul", "ex": "Hot, partly molten rock."}, {"en": "core", "ar": "اللب", "pr": "kor", "ex": "Iron and nickel centre."}, {"en": "tectonic plates", "ar": "الصفائح التكتونية", "pr": "tek-TON-ik playts", "ex": "Move slowly."}, {"en": "earthquake", "ar": "زلزال", "pr": "URTH-kwayk", "ex": "Plates slip."}]}]}, {"n": 11, "title": "Forces and Their Effects", "lessons": [{"id": "11.1", "title": "Forces", "paras": ["A force is a push or a pull. Its unit is the newton (N). Forces can change the speed of an object, change its direction, change its shape, or make it start or stop moving. Forces are measured with a newton meter (spring balance). Contact forces act when objects touch (friction, push, air resistance), and non-contact forces act at a distance (gravity, magnetism, electrostatic force).", "Balanced forces do not change the motion. Unbalanced forces do. When forces are balanced a still object stays still, and a moving object keeps moving at the same speed in a straight line."], "key": ["force", "newton", "balanced", "unbalanced", "contact force"], "qs": [{"q": "What is the unit of force?", "o": ["The newton (N).", "Change speed, direction or shape.", "Gravity or magnetism.", "A newton meter (spring balance)."], "a": 0}, {"q": "Name two effects a force can have.", "o": ["A newton meter (spring balance).", "The newton (N).", "Gravity or magnetism.", "Change speed, direction or shape."], "a": 3}, {"q": "Give an example of a non-contact force.", "o": ["Gravity or magnetism.", "Change speed, direction or shape.", "A newton meter (spring balance).", "The newton (N)."], "a": 0}, {"q": "What instrument measures force?", "o": ["Change speed, direction or shape.", "A newton meter (spring balance).", "Gravity or magnetism.", "The newton (N)."], "a": 1}], "cards": [{"en": "force", "ar": "قوة", "pr": "fors", "ex": "A push or a pull."}, {"en": "newton", "ar": "نيوتن", "pr": "NYOO-tun", "ex": "The unit of force."}, {"en": "balanced", "ar": "متوازنة", "pr": "BAL-enst", "ex": "Forces cancel."}, {"en": "unbalanced", "ar": "غير متوازنة", "pr": "un-BAL-enst", "ex": "Change motion."}, {"en": "contact force", "ar": "قوة تلامس", "pr": "KON-takt fors", "ex": "Friction."}]}, {"id": "11.2", "title": "The Magnitude and Direction of a Force", "paras": ["A force has size (magnitude) and direction. We draw it as an arrow: the length shows the size and the arrow points the way the force acts. If two forces act on an object in the same direction, add them. If opposite, subtract them to get the resultant force. Example: pushing a box with 30 N while friction pushes back 10 N gives a resultant of 20 N in the direction of the push. If the forces are equal and opposite, the resultant is zero."], "key": ["magnitude", "direction", "resultant force", "arrow"], "qs": [{"q": "What does the length of a force arrow show?", "o": ["18 N.", "Zero.", "3 N, in the direction of the bigger force.", "The size of the force."], "a": 3}, {"q": "Two forces of 8 N and 5 N act in opposite directions. What is the resultant?", "o": ["The size of the force.", "18 N.", "Zero.", "3 N, in the direction of the bigger force."], "a": 3}, {"q": "What is the resultant of equal opposite forces?", "o": ["The size of the force.", "3 N, in the direction of the bigger force.", "18 N.", "Zero."], "a": 3}, {"q": "A 12 N push and 6 N push act in the same direction. Total?", "o": ["18 N.", "3 N, in the direction of the bigger force.", "The size of the force.", "Zero."], "a": 0}], "cards": [{"en": "magnitude", "ar": "مقدار", "pr": "MAG-ni-tyood", "ex": "The size of a force."}, {"en": "direction", "ar": "اتجاه", "pr": "di-REK-shun", "ex": "Which way a force acts."}, {"en": "resultant force", "ar": "القوة المحصلة", "pr": "ri-ZUL-tunt fors", "ex": "30 N minus 10 N is 20 N."}, {"en": "arrow", "ar": "سهم", "pr": "AR-oh", "ex": "Shows a force."}]}, {"id": "11.3", "title": "Gravitational Force", "paras": ["Gravity is a force of attraction between any two objects with mass. The Earth's gravity pulls everything toward its centre. The pull on an object is its weight, measured in newtons. Weight = mass x gravitational field strength. On Earth, g is about 10 N/kg, so a 5 kg mass weighs 50 N. The Moon's gravity is about one sixth of Earth's, so the same object weighs less there, but its mass stays the same."], "key": ["gravity", "weight", "mass", "gravitational field strength"], "qs": [{"q": "What is the weight of a 3 kg object on Earth (g = 10 N/kg)?", "o": ["No, only weight changes.", "Mass is the amount of matter (kg); weight is the pull of gravity on it (N).", "Towards the centre of the Earth.", "30 N."], "a": 3}, {"q": "What is the difference between mass and weight?", "o": ["No, only weight changes.", "30 N.", "Mass is the amount of matter (kg); weight is the pull of gravity on it (N).", "Towards the centre of the Earth."], "a": 2}, {"q": "Does mass change on the Moon?", "o": ["30 N.", "No, only weight changes.", "Towards the centre of the Earth.", "Mass is the amount of matter (kg); weight is the pull of gravity on it (N)."], "a": 1}, {"q": "What direction does gravity pull on Earth?", "o": ["30 N.", "Towards the centre of the Earth.", "Mass is the amount of matter (kg); weight is the pull of gravity on it (N).", "No, only weight changes."], "a": 1}], "cards": [{"en": "gravity", "ar": "الجاذبية", "pr": "GRAV-i-tee", "ex": "Pulls things to Earth."}, {"en": "weight", "ar": "الوزن", "pr": "wayt", "ex": "A 5 kg mass weighs 50 N."}, {"en": "mass", "ar": "الكتلة", "pr": "mass", "ex": "A bag of rice has a mass of 2 kg."}, {"en": "gravitational field strength", "ar": "شدة مجال الجاذبية", "pr": "grav-i-TAY-shun-ul feeld strength", "ex": "10 N/kg on Earth."}]}, {"id": "11.4", "title": "Frictional Force", "paras": ["Friction is a force that opposes movement between two surfaces in contact. It acts in the opposite direction to motion. It is caused by the roughness of surfaces. Friction produces heat and wears surfaces.", "Useful friction: grip of shoes and tyres, brakes. Reduce friction with oil, grease, wheels, polishing or smooth surfaces. Increase friction with rough soles and tyre treads."], "key": ["friction", "rough", "lubricant", "brake"], "qs": [{"q": "Which direction does friction act?", "o": ["Oil, grease, wheels, smoother surfaces.", "Opposite to the motion.", "Brakes, shoe grip, tyre grip.", "Heat."], "a": 1}, {"q": "Give one way to reduce friction.", "o": ["Oil, grease, wheels, smoother surfaces.", "Heat.", "Opposite to the motion.", "Brakes, shoe grip, tyre grip."], "a": 0}, {"q": "Give one useful example of friction.", "o": ["Oil, grease, wheels, smoother surfaces.", "Heat.", "Opposite to the motion.", "Brakes, shoe grip, tyre grip."], "a": 3}, {"q": "What energy form does friction produce?", "o": ["Heat.", "Opposite to the motion.", "Brakes, shoe grip, tyre grip.", "Oil, grease, wheels, smoother surfaces."], "a": 0}], "cards": [{"en": "friction", "ar": "الاحتكاك", "pr": "FRIK-shun", "ex": "Brakes use friction."}, {"en": "rough", "ar": "خشن", "pr": "ruf", "ex": "A rough surface has more friction."}, {"en": "lubricant", "ar": "مادة تشحيم", "pr": "LOO-bri-kunt", "ex": "Oil reduces friction."}, {"en": "brake", "ar": "فرامل", "pr": "brayk", "ex": "Slows a bike."}]}, {"id": "11.5", "title": "Air Resistance", "paras": ["Air resistance (drag) is a friction-type force that opposes the motion of an object through air. It increases with speed and with a larger surface area. A parachute has a large area, so it creates a lot of air resistance and slows the fall. Streamlined shapes such as cars and aircraft reduce air resistance. Cyclists crouch for the same reason. Falling objects speed up until air resistance equals weight, then fall at constant terminal speed. Water resistance is the same effect in water."], "key": ["air resistance", "drag", "streamlined", "parachute", "terminal speed"], "qs": [{"q": "Why does a parachute slow a skydiver?", "o": ["To reduce air resistance.", "A shape that reduces air resistance.", "Its large area gives a big air resistance.", "Increases."], "a": 2}, {"q": "What does streamlined mean?", "o": ["Its large area gives a big air resistance.", "A shape that reduces air resistance.", "Increases.", "To reduce air resistance."], "a": 1}, {"q": "Does air resistance increase or decrease with speed?", "o": ["Increases.", "To reduce air resistance.", "Its large area gives a big air resistance.", "A shape that reduces air resistance."], "a": 0}, {"q": "Why do cyclists crouch low?", "o": ["Its large area gives a big air resistance.", "Increases.", "A shape that reduces air resistance.", "To reduce air resistance."], "a": 3}], "cards": [{"en": "air resistance", "ar": "مقاومة الهواء", "pr": "air ri-ZIS-tens", "ex": "Slows a falling object."}, {"en": "drag", "ar": "السحب", "pr": "drag", "ex": "Resists movement through fluid."}, {"en": "streamlined", "ar": "انسيابي", "pr": "STREEM-lynd", "ex": "A car shape reduces drag."}, {"en": "parachute", "ar": "مظلة هبوط", "pr": "PA-ruh-shoot", "ex": "Slows a skydiver."}, {"en": "terminal speed", "ar": "السرعة الحدية", "pr": "TUR-mi-nul speed", "ex": "Constant falling speed."}]}]}, {"n": 12, "title": "Energy", "lessons": [{"id": "12.1", "title": "What Is Energy?", "paras": ["Energy is the ability to make things happen or do work. It is measured in joules (J), and large amounts in kilojoules (kJ). Energy cannot be seen but we notice its effects, such as movement, heat, light and sound. Living things get energy from food, and machines get it from fuel or electricity. Anything that moves, grows, heats or lights up uses energy."], "key": ["energy", "joule", "work", "fuel"], "qs": [{"q": "What is the unit of energy?", "o": ["From food.", "Moving, lighting, heating, growing.", "3000 J.", "The joule (J)."], "a": 3}, {"q": "Where do living things get energy?", "o": ["From food.", "The joule (J).", "3000 J.", "Moving, lighting, heating, growing."], "a": 0}, {"q": "How many joules in 3 kJ?", "o": ["3000 J.", "The joule (J).", "From food.", "Moving, lighting, heating, growing."], "a": 0}, {"q": "Give one thing that needs energy.", "o": ["3000 J.", "The joule (J).", "Moving, lighting, heating, growing.", "From food."], "a": 2}], "cards": [{"en": "energy", "ar": "الطاقة", "pr": "EN-er-jee", "ex": "Moves, heats and lights things."}, {"en": "joule", "ar": "جول", "pr": "jool", "ex": "The unit of energy."}, {"en": "work", "ar": "الشغل", "pr": "wurk", "ex": "Lifting a box is work."}, {"en": "fuel", "ar": "وقود", "pr": "FYOO-ul", "ex": "Petrol stores chemical energy."}]}, {"id": "12.2", "title": "What Are the Different Forms of Energy?", "paras": ["Kinetic energy: energy of moving things. Potential energy: stored energy. Gravitational potential energy is stored by lifting an object up; elastic potential energy is stored in stretched or squashed things like springs. Chemical energy is stored in food, fuel and batteries. Heat (thermal) energy comes from hot objects. Light energy comes from the Sun and lamps. Sound energy comes from vibrations. Electrical energy flows in circuits. Nuclear energy is stored in atoms.", "The more mass and speed, the more kinetic energy. The higher the object, the more gravitational potential energy."], "key": ["kinetic", "potential", "chemical", "thermal", "light", "sound", "electrical", "nuclear"], "qs": [{"q": "What form of energy is stored in food?", "o": ["Elastic potential energy.", "Chemical energy.", "Kinetic energy.", "More gravitational potential energy because it is higher."], "a": 1}, {"q": "What type of energy does a moving car have?", "o": ["Kinetic energy.", "Chemical energy.", "Elastic potential energy.", "More gravitational potential energy because it is higher."], "a": 0}, {"q": "What energy does a stretched rubber band store?", "o": ["Elastic potential energy.", "Kinetic energy.", "Chemical energy.", "More gravitational potential energy because it is higher."], "a": 0}, {"q": "Why does a book on a high shelf have more energy than on the floor?", "o": ["Chemical energy.", "More gravitational potential energy because it is higher.", "Kinetic energy.", "Elastic potential energy."], "a": 1}], "cards": [{"en": "kinetic", "ar": "حركية", "pr": "ki-NET-ik", "ex": "A moving car."}, {"en": "potential", "ar": "كامنة", "pr": "puh-TEN-shul", "ex": "A book on a shelf."}, {"en": "chemical", "ar": "كيميائية", "pr": "KEM-i-kul", "ex": "Stored in food."}, {"en": "thermal", "ar": "حرارية", "pr": "THUR-mul", "ex": "From a hot object."}, {"en": "light", "ar": "ضوئية", "pr": "lyt", "ex": "From the Sun."}, {"en": "sound", "ar": "صوتية", "pr": "sownd", "ex": "From vibrations."}, {"en": "electrical", "ar": "كهربائية", "pr": "i-LEK-tri-kul", "ex": "Flows in a circuit."}, {"en": "nuclear", "ar": "نووية", "pr": "NYOO-klee-er", "ex": "Stored in atoms."}]}, {"id": "12.3", "title": "Energy Transfer and Transformation", "paras": ["Energy can be transferred from place to place, or transformed from one form to another. For example, a torch transforms chemical energy in a battery into electrical energy and then light and heat. A cyclist turns chemical energy in food into kinetic and heat energy. A falling ball turns gravitational potential energy into kinetic energy.", "Heat is transferred by conduction (through solids, particle to particle), convection (in liquids and gases as warm fluid rises) and radiation (as waves, which needs no material, like heat from the Sun). Energy flow diagrams show the changes. Some energy is always wasted, usually as heat. Efficiency tells how much of the energy is useful."], "key": ["transfer", "transformation", "conduction", "convection", "radiation", "efficiency"], "qs": [{"q": "What energy change happens in a light bulb?", "o": ["Electrical energy to light and heat.", "Heat.", "Radiation.", "Conduction."], "a": 0}, {"q": "How does heat travel through a metal spoon?", "o": ["Heat.", "Electrical energy to light and heat.", "Conduction.", "Radiation."], "a": 2}, {"q": "Which heat transfer needs no material?", "o": ["Radiation.", "Heat.", "Conduction.", "Electrical energy to light and heat."], "a": 0}, {"q": "What energy form is usually wasted?", "o": ["Electrical energy to light and heat.", "Radiation.", "Heat.", "Conduction."], "a": 2}], "cards": [{"en": "transfer", "ar": "نقل", "pr": "TRANS-fer", "ex": "Heat moves from hot to cold."}, {"en": "transformation", "ar": "تحول", "pr": "trans-fer-MAY-shun", "ex": "Electrical to light."}, {"en": "conduction", "ar": "التوصيل", "pr": "kun-DUK-shun", "ex": "Heat in a metal spoon."}, {"en": "convection", "ar": "الحمل الحراري", "pr": "kun-VEK-shun", "ex": "Warm air rises."}, {"en": "radiation", "ar": "الإشعاع", "pr": "ray-dee-AY-shun", "ex": "Heat from the Sun."}, {"en": "efficiency", "ar": "الكفاءة", "pr": "i-FISH-un-see", "ex": "Useful energy out of total."}]}, {"id": "12.4", "title": "Energy Conservation", "paras": ["The law of conservation of energy says energy cannot be created or destroyed. It can only change form. The total amount of energy before and after a change is the same. A swinging pendulum swaps potential and kinetic energy, and slowly slows because some energy becomes heat from friction and air resistance. The energy is not lost, just spread into the surroundings.", "We also conserve energy resources by saving electricity and fuel, using insulation, efficient appliances and renewable sources."], "key": ["conservation of energy", "wasted energy", "insulation"], "qs": [{"q": "State the law of conservation of energy.", "o": ["Energy cannot be created or destroyed, only changed from one form to another.", "Energy changes to heat through friction and air resistance.", "Kinetic energy.", "Switch off lights, insulate, use efficient appliances."], "a": 0}, {"q": "Why does a pendulum eventually stop?", "o": ["Switch off lights, insulate, use efficient appliances.", "Energy changes to heat through friction and air resistance.", "Kinetic energy.", "Energy cannot be created or destroyed, only changed from one form to another."], "a": 1}, {"q": "Give one way to save energy at home.", "o": ["Energy changes to heat through friction and air resistance.", "Energy cannot be created or destroyed, only changed from one form to another.", "Switch off lights, insulate, use efficient appliances.", "Kinetic energy."], "a": 2}, {"q": "When a ball falls, gravitational potential energy changes to what?", "o": ["Switch off lights, insulate, use efficient appliances.", "Energy cannot be created or destroyed, only changed from one form to another.", "Energy changes to heat through friction and air resistance.", "Kinetic energy."], "a": 3}], "cards": [{"en": "conservation of energy", "ar": "حفظ الطاقة", "pr": "kon-ser-VAY-shun uv EN-er-jee", "ex": "Energy is never lost."}, {"en": "wasted energy", "ar": "طاقة مهدرة", "pr": "WAY-stid EN-er-jee", "ex": "Heat from a bulb."}, {"en": "insulation", "ar": "العزل", "pr": "in-syoo-LAY-shun", "ex": "A coat keeps heat in."}]}]}, {"n": 13, "title": "The Earth and Beyond", "lessons": [{"id": "13.1", "title": "The Sun, the Earth and the Moon", "paras": ["The Earth spins on its axis once every 24 hours, giving day and night. The axis is tilted, and as the Earth orbits the Sun once a year (about 365 days), the tilt causes the seasons. The Moon orbits the Earth about every 27 to 29 days. We see the Moon because it reflects sunlight. The shape we see changes in phases: new Moon, crescent, first quarter, full Moon and back.", "An eclipse happens when the Sun, Moon and Earth line up. In a solar eclipse the Moon blocks the Sun. In a lunar eclipse the Earth's shadow falls on the Moon."], "key": ["rotation", "orbit", "axis", "seasons", "phases", "eclipse"], "qs": [{"q": "What causes day and night?", "o": ["It reflects light from the Sun.", "About 365 days (one year).", "When the Moon moves between the Sun and Earth, blocking sunlight.", "The Earth spinning on its axis."], "a": 3}, {"q": "How long does the Earth take to orbit the Sun?", "o": ["The Earth spinning on its axis.", "When the Moon moves between the Sun and Earth, blocking sunlight.", "About 365 days (one year).", "It reflects light from the Sun."], "a": 2}, {"q": "Why do we see the Moon?", "o": ["The Earth spinning on its axis.", "About 365 days (one year).", "When the Moon moves between the Sun and Earth, blocking sunlight.", "It reflects light from the Sun."], "a": 3}, {"q": "What is a solar eclipse?", "o": ["It reflects light from the Sun.", "When the Moon moves between the Sun and Earth, blocking sunlight.", "The Earth spinning on its axis.", "About 365 days (one year)."], "a": 1}], "cards": [{"en": "rotation", "ar": "الدوران حول المحور", "pr": "roh-TAY-shun", "ex": "Causes day and night."}, {"en": "orbit", "ar": "مدار", "pr": "OR-bit", "ex": "Earth orbits the Sun."}, {"en": "axis", "ar": "محور", "pr": "AK-sis", "ex": "Earth's tilted axis."}, {"en": "seasons", "ar": "فصول", "pr": "SEE-zunz", "ex": "Summer and winter."}, {"en": "phases", "ar": "أطوار", "pr": "FAY-ziz", "ex": "Moon phases."}, {"en": "eclipse", "ar": "كسوف / خسوف", "pr": "i-KLIPS", "ex": "The Moon blocks the Sun."}]}, {"id": "13.2", "title": "The Solar System", "paras": ["The Solar System is the Sun and everything orbiting it. The eight planets in order from the Sun are Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune. The four inner planets are small and rocky. Jupiter and Saturn are huge gas giants, and Uranus and Neptune are ice giants. Also in the system are moons, dwarf planets such as Pluto, asteroids (mostly in a belt between Mars and Jupiter) and comets. The Sun is a star: a huge ball of hot gas that gives out light and heat. A memory aid: My Very Easy Method Just Speeds Up Naming."], "key": ["planet", "Sun", "star", "asteroid", "comet", "gas giant"], "qs": [{"q": "Name the planet closest to the Sun.", "o": ["Mercury.", "Jupiter.", "A star.", "Between Mars and Jupiter."], "a": 0}, {"q": "Which is the largest planet?", "o": ["Between Mars and Jupiter.", "Mercury.", "A star.", "Jupiter."], "a": 3}, {"q": "Where is the asteroid belt?", "o": ["Mercury.", "Between Mars and Jupiter.", "A star.", "Jupiter."], "a": 1}, {"q": "Is the Sun a planet or a star?", "o": ["Between Mars and Jupiter.", "A star.", "Mercury.", "Jupiter."], "a": 1}], "cards": [{"en": "planet", "ar": "كوكب", "pr": "PLAN-it", "ex": "Earth is a planet."}, {"en": "Sun", "ar": "الشمس", "pr": "sun", "ex": "Our nearest star."}, {"en": "star", "ar": "نجم", "pr": "star", "ex": "The Sun is a star."}, {"en": "asteroid", "ar": "كويكب", "pr": "AS-tuh-royd", "ex": "A rock in the belt."}, {"en": "comet", "ar": "مذنب", "pr": "KOM-it", "ex": "A ball of ice with a tail."}, {"en": "gas giant", "ar": "عملاق غازي", "pr": "gas JY-unt", "ex": "Jupiter."}]}, {"id": "13.3", "title": "Beyond the Solar System", "paras": ["Our Sun is one of billions of stars in the Milky Way galaxy. A galaxy is a huge group of stars, gas and dust held by gravity. The universe contains billions of galaxies. Distances in space are so large that scientists measure them in light-years: the distance light travels in one year. The nearest star after the Sun, Proxima Centauri, is about 4.2 light-years away. Stars group into patterns called constellations. Some stars have their own planets, called exoplanets."], "key": ["galaxy", "Milky Way", "universe", "light-year", "constellation"], "qs": [{"q": "What is a galaxy?", "o": ["The distance light travels in one year.", "A huge group of stars, gas and dust held together by gravity.", "A pattern of stars seen from Earth.", "The Milky Way."], "a": 1}, {"q": "What is a light-year?", "o": ["A pattern of stars seen from Earth.", "A huge group of stars, gas and dust held together by gravity.", "The distance light travels in one year.", "The Milky Way."], "a": 2}, {"q": "Which galaxy is the Solar System in?", "o": ["A pattern of stars seen from Earth.", "A huge group of stars, gas and dust held together by gravity.", "The Milky Way.", "The distance light travels in one year."], "a": 2}, {"q": "What is a constellation?", "o": ["A pattern of stars seen from Earth.", "The distance light travels in one year.", "A huge group of stars, gas and dust held together by gravity.", "The Milky Way."], "a": 0}], "cards": [{"en": "galaxy", "ar": "مجرة", "pr": "GAL-uk-see", "ex": "Milky Way."}, {"en": "Milky Way", "ar": "درب التبانة", "pr": "MIL-kee way", "ex": "Our galaxy."}, {"en": "universe", "ar": "الكون", "pr": "YOO-ni-vurs", "ex": "Everything that exists."}, {"en": "light-year", "ar": "سنة ضوئية", "pr": "LYT-yeer", "ex": "Distance light travels in a year."}, {"en": "constellation", "ar": "كوكبة", "pr": "kon-stuh-LAY-shun", "ex": "Patterns of stars."}]}, {"id": "13.4", "title": "Exploring Space", "paras": ["People explore space using telescopes, satellites, space probes, rovers and crewed spacecraft. Telescopes see distant objects. Artificial satellites orbit Earth and are used for communication, weather forecasting and navigation (GPS). Probes visit planets without people, and rovers drive on other worlds such as Mars. The International Space Station orbits Earth with astronauts. Space exploration brings new knowledge and technology, but is expensive and risky."], "key": ["telescope", "satellite", "probe", "rover", "space station"], "qs": [{"q": "Name two uses of satellites.", "o": ["Makes distant objects appear closer and clearer.", "A vehicle that drives across the surface of another planet.", "It is expensive or risky.", "Communication, weather forecasts, navigation."], "a": 3}, {"q": "What is a rover?", "o": ["It is expensive or risky.", "Communication, weather forecasts, navigation.", "Makes distant objects appear closer and clearer.", "A vehicle that drives across the surface of another planet."], "a": 3}, {"q": "Give one disadvantage of space exploration.", "o": ["A vehicle that drives across the surface of another planet.", "Makes distant objects appear closer and clearer.", "Communication, weather forecasts, navigation.", "It is expensive or risky."], "a": 3}, {"q": "What does a telescope do?", "o": ["A vehicle that drives across the surface of another planet.", "Makes distant objects appear closer and clearer.", "It is expensive or risky.", "Communication, weather forecasts, navigation."], "a": 1}], "cards": [{"en": "telescope", "ar": "تلسكوب", "pr": "TEL-uh-skohp", "ex": "Galileo used one."}, {"en": "satellite", "ar": "قمر صناعي", "pr": "SAT-uh-lyt", "ex": "Used for GPS."}, {"en": "probe", "ar": "مسبار", "pr": "prohb", "ex": "Visits other planets."}, {"en": "rover", "ar": "مركبة جوالة", "pr": "ROH-ver", "ex": "Drives on Mars."}, {"en": "space station", "ar": "محطة فضائية", "pr": "spays STAY-shun", "ex": "Astronauts live there."}]}, {"id": "13.5", "title": "A Brief History of Astronomy", "paras": ["Early people watched the sky to tell time and seasons. Ancient Greeks believed the Earth was at the centre of the universe (the geocentric model). In the 1500s Nicolaus Copernicus proposed that the planets orbit the Sun (the heliocentric model). Galileo used a telescope in 1609 and saw the Moon's craters, Jupiter's moons and phases of Venus, which supported the Sun-centred model. Later Johannes Kepler explained planetary orbits and Isaac Newton explained gravity. Muslim astronomers such as Al-Battani and Ibn al-Haytham also made careful observations and measurements during the Middle Ages."], "key": ["geocentric", "heliocentric", "Copernicus", "Galileo", "astronomy"], "qs": [{"q": "What did Copernicus propose?", "o": ["That the planets, including Earth, orbit the Sun.", "The idea that the Earth is at the centre of the universe.", "Isaac Newton.", "Galileo."], "a": 0}, {"q": "Who first used a telescope to study the sky in 1609?", "o": ["Galileo.", "The idea that the Earth is at the centre of the universe.", "Isaac Newton.", "That the planets, including Earth, orbit the Sun."], "a": 0}, {"q": "What is the geocentric model?", "o": ["The idea that the Earth is at the centre of the universe.", "Galileo.", "That the planets, including Earth, orbit the Sun.", "Isaac Newton."], "a": 0}, {"q": "Which scientist explained gravity?", "o": ["The idea that the Earth is at the centre of the universe.", "That the planets, including Earth, orbit the Sun.", "Galileo.", "Isaac Newton."], "a": 3}], "cards": [{"en": "geocentric", "ar": "مركزية الأرض", "pr": "jee-oh-SEN-trik", "ex": "Earth at the centre."}, {"en": "heliocentric", "ar": "مركزية الشمس", "pr" function tile(term,i){const c=(term.replace(/[^A-Za-z]/,'').charAt(0)||'?').toUpperCase();return `<svg viewBox="0 0 120 80" class="hs-tile" role="img" aria-label="${esc(term)}"><rect width="120" height="80" rx="10" fill="${TILE[i%6]}"/><circle cx="96" cy="16" r="26" fill="#fff" opacity=".15"/><circle cx="20" cy="70" r="30" fill="#fff" opacity=".12"/><text x="60" y="52" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#fff">${c}</text></svg>`;}

  const t=e.target.closest('button'); if(!t)return;
  if(t.dataset.q!==undefined){st.ans[t.dataset.q]=+t.dataset.o;const y=scrollY;render();scrollTo(0,y);}
  else if(t.id==='submit'){st.done=true;render();}
  else if(t.id==='retry'){st={ans:{},done:false,open:{}};render();}
  else if(t.dataset.fc){st.open[t.dataset.fc]=!st.open[t.dataset.fc];const y=scrollY;render();scrollTo(0,y);}
});
nav();
</script></body></html>
